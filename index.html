<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pattern Maker</title>
<style>
  :root {
    --bg: #fafafa;
    --line: #d8dcdf;
    --muted: #9aa0a5;
    --ink: #1c2226;
    --accent: #2a7de1;
    --r-sm: 8px;
    --r-lg: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    height: 100%;
  }
  body {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    gap: 10px;
  }

  /* ---- Top panel ---- */
  #topPanel {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 36px;
  }
  #segTopToggle, .switchLabel {
    position: relative;
    display: inline-block;
    cursor: pointer;
  }
  #segTopToggle input, .switchLabel input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switchTrack {
    display: block;
    width: 40px;
    height: 22px;
    border-radius: 11px;
    background: var(--line);
    transition: background 0.15s ease;
  }
  .switchThumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    transition: transform 0.15s ease;
  }
  #segTopCheckbox:checked ~ .switchTrack,
  #autoAdvanceCheckbox:checked ~ .switchTrack { background: var(--accent); }
  #segTopCheckbox:checked ~ .switchTrack .switchThumb,
  #autoAdvanceCheckbox:checked ~ .switchTrack .switchThumb { transform: translateX(18px); }
  #clearAllBtn {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: var(--r-sm);
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  #clearAllBtn:active { background: #f0f0f0; }

  #patternNameInput {
    flex: 0 0 auto;
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: var(--r-sm);
    border: 1.5px solid var(--line);
  }

  /* ---- Glyph bar (now real, one slot per image) ---- */
  #glyphBar {
    flex: 0 0 auto;
    height: 132px;
    border: 1.5px solid var(--line);
    border-radius: var(--r-lg);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .glyphSlot {
    position: relative;
    flex: 0 0 auto;
    min-width: 72px;
    height: 100%;
    border-radius: var(--r-sm);
    border: 1.5px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 8px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    background: var(--bg);
  }
  .glyphSlot.committed {
    border-color: var(--accent);
  }
  .glyphSlot.dragging {
    opacity: 0.85;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .posBadge {
    position: absolute;
    top: 3px;
    left: 3px;
    min-width: 15px;
    height: 15px;
    padding: 0 3px;
    border-radius: 8px;
    background: #eef0f2;
    color: var(--muted);
    font-size: 9px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .glyphImg {
    height: 72px;
    width: auto;
    display: block;
  }
  .notationLabel {
    color: var(--ink);
    font-weight: 600;
    font-size: 10px;
    white-space: nowrap;
    margin-top: 2px;
  }

  /* ---- Main canvas ---- */
  #mainCanvasWrap {
    flex: 0 0 auto;
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
    border: 1.5px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
    background: #fff;
    touch-action: none;
  }
  #mainCanvasTrack {
    position: absolute;
    inset: 0;
    display: flex;
    height: 100%;
    will-change: transform;
  }
  .slide {
    position: relative;
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .pointsOverlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .connectorOverlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .geometryOverlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .markerGroup {
    position: absolute;
  }
  .ghostLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .ghostDot {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.55;
    border: 1px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
  }
  .ghostDot.slot-A { background: #c0392b; }
  .ghostDot.slot-R { background: #e67e22; }
  .ghostDot.slot-L { background: #2874a6; }
  .segBadge {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, 9px);
    font-size: 9px;
    font-weight: 600;
    color: #444;
    background: #fff;
    padding: 1px 4px;
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    pointer-events: none;
    white-space: nowrap;
  }
  .markerRing {
    position: absolute;
    left: 0;
    top: 0;
    border-radius: 50%;
    border: 2px solid;
    background: transparent;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .markerRing.slot-A { border-color: #c0392b; }
  .markerRing.slot-R { border-color: #e67e22; }
  .markerRing.slot-L { border-color: #2874a6; }
  .markerRing.crossed { border-radius: 3px; }
  .pointMarker {
    position: absolute;
    left: 0;
    top: 0;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
    pointer-events: auto;
    touch-action: none;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
    user-select: none;
    line-height: 1;
  }
  .pointMarker:active { cursor: grabbing; }
  .pointMarker.crossed {
    text-decoration: underline;
    text-underline-offset: 2px;
    border-radius: 3px;
  }
  .grabRing {
    position: absolute;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
    border: 3px solid #ffffff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    border-radius: 50%;
    background: transparent;
    pointer-events: none;
  }
  .pointMarker.slot-A { background: #c0392b; }
  .pointMarker.slot-R { background: #e67e22; }
  .pointMarker.slot-L { background: #2874a6; }
  #emptyState {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 0 40px;
    line-height: 1.5;
  }
  #canvasTopRow {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 30px;
  }
  .ctrlBtn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #slotButtons {
    display: flex;
    gap: 10px;
  }
  #rightControls {
    display: flex;
    gap: 10px;
  }
  .ctrlBtn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .slotBtn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ---- Dots ---- */
  #dots {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    min-height: 14px;
  }
  #dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d3d7da;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  #dots .dot.active { background: var(--accent); }

  /* ---- Button panel ---- */
  #buttonPanel {
    flex: 0 0 auto;
    border: 1.5px solid var(--line);
    border-radius: var(--r-lg);
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  #cameraBtn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #cameraBtn:active { background: #2568c2; }

  #commitBtn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 16px;
    cursor: not-allowed;
  }
  #commitBtn:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    cursor: pointer;
  }
  #commitBtn:not(:disabled):active { background: #eaf2fc; }

  #exportBtn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 18px;
    cursor: not-allowed;
  }
  #exportBtn:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    cursor: pointer;
  }
  #exportBtn:not(:disabled):active { background: #eaf2fc; }

  /* ==================== MODAL ==================== */
  #modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 18, 0.92);
    z-index: 50;
    display: none;
    flex-direction: column;
  }
  #modalOverlay.open { display: flex; }

  /* -- Crop carousel view (the modal's only view now) -- */
  #cropView {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    height: 100%;
    padding: 20px;
  }
  #cropView.active { display: flex; }
  #mirrorPickerView {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100%;
    padding: 20px;
  }
  #mirrorPickerView.active { display: flex; }
  #averagePickerView {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100%;
    padding: 20px;
  }
  #averagePickerView.active { display: flex; }
  #settingsBtn {
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); font-size: 16px; cursor: pointer;
  }
  #settingsView {
    display: none;
    flex-direction: column;
    gap: 16px;
    height: 100%;
    padding: 20px;
  }
  #settingsView.active { display: flex; }
  #settingsScroll { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .settingsRow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .settingsRowLabel { font-size: 14px; color: #ccc; }
  #glyphSliders { margin-top: 8px; display: flex; flex-direction: column; gap: 10px; }
  .glyphSliderRow { display: flex; align-items: center; gap: 10px; }
  .glyphSliderRow .name { flex: 0 0 100px; font-size: 12.5px; color: #666; }
  .glyphSliderRow input[type="range"] { flex: 1; }
  .glyphSliderRow .val { flex: 0 0 32px; text-align: right; font-size: 12.5px; }
  #averagePickerHint { color: #888; font-size: 13px; }
  .mirrorThumb.target { border-color: #c0392b; cursor: default; }
  .mirrorThumbBadge.target { background: #c0392b; }
  #mirrorPickerHint { color: #888; font-size: 13px; }
  #mirrorPickerGrid, #averagePickerGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-height: 60vh;
    overflow-y: auto;
  }
  .mirrorThumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .mirrorThumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mirrorThumb.selected { border-color: var(--accent); }
  .mirrorThumbBadge {
    position: absolute; top: 4px; left: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  #cropIndicator { color: #888; font-size: 12px; letter-spacing: 0.4px; text-transform: uppercase; }
  #cropStage { display: flex; align-items: center; gap: 14px; }
  .cropNavBtn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid #444; background: rgba(255,255,255,0.08);
    color: #eee; font-size: 18px; cursor: pointer; flex: 0 0 auto;
  }
  .cropNavBtn:disabled { opacity: 0.3; }
  #cropCanvas {
    touch-action: none;
    border-radius: 8px;
    background: #111;
    cursor: grab;
  }
  #cropButtons { width: 100%; max-width: 300px; display: flex; gap: 12px; }
  #cropButtons button {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444;
    background: rgba(255,255,255,0.08); color: #eee; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer;
  }
  #cropConfirmAll { background: var(--accent); border-color: var(--accent); }
  #cropHint { color: #555; font-size: 10.5px; text-align: center; max-width: 280px; }

  #fileInput { display: none; }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink);
    color: #fff;
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="topPanel">
  <button id="settingsBtn" aria-label="Settings">⚙</button>
  <button id="clearAllBtn">Clear All</button>
</div>

  <input type="text" id="patternNameInput" placeholder="Pattern name">
<div id="glyphBar"></div>

  <div id="canvasTopRow">
    <div id="slotButtons">
      <button class="ctrlBtn slotBtn" data-slot="A" aria-label="Air slot">A</button>
      <button class="ctrlBtn slotBtn" data-slot="R" aria-label="Right hand slot">R</button>
      <button class="ctrlBtn slotBtn" data-slot="L" aria-label="Left hand slot">L</button>
    </div>
    <div id="rightControls">
      <button id="averageBtn" class="ctrlBtn" aria-label="Average this image with later images" disabled>≈</button>
      <button id="mirrorAverageBtn" class="ctrlBtn" aria-label="Mirror-average two images" disabled>-|-</button>
      <button id="deleteActiveBtn" class="ctrlBtn" aria-label="Delete this image">✕</button>
    </div>
  </div>

  <div id="mainCanvasWrap">
    <div id="mainCanvasTrack"></div>
    <div id="emptyState">Tap the camera button below to add photos</div>
  </div>

  <div id="dots"></div>

  <div id="buttonPanel">
  <button id="commitBtn" disabled aria-label="Commit position">▲+</button>
  <button id="cameraBtn" aria-label="Add photos">📷</button>
  <button id="exportBtn" aria-label="Export pattern">⭳</button>
</div>

<input type="file" id="fileInput" accept="image/*" multiple>

<div id="toast"></div>

<div id="modalOverlay">
  <!-- Crop carousel -->
  <div id="cropView">
    <div id="cropIndicator">1 / 1</div>
    <div id="cropStage">
      <button id="cropPrev" class="cropNavBtn" aria-label="Previous">‹</button>
      <canvas id="cropCanvas" width="280" height="280"></canvas>
      <button id="cropNext" class="cropNavBtn" aria-label="Next">›</button>
    </div>
    <div id="cropButtons">
      <button id="cropCancelAll">Cancel</button>
      <button id="cropApplyAll">Apply to all</button>
      <button id="cropConfirmAll">Use photos</button>
    </div>
    <p id="cropHint">Drag or swipe to switch photos · pinch, scroll, or drag to zoom/pan</p>
  </div>

  <!-- Mirror-average picker: select exactly 2 unlocked images -->
  <div id="mirrorPickerView">
    <p id="mirrorPickerHint">Select two photos to mirror-average</p>
    <div id="mirrorPickerGrid"></div>
    <div id="cropButtons">
      <button id="mirrorPickerCancel">Cancel</button>
      <button id="mirrorPickerConfirm" disabled>Continue</button>
    </div>
  </div>

  <!-- Average picker: target (fixed, active image at tap time) shown red,
       any number of other unlocked images tappable as sources (blue) -->
  <div id="averagePickerView">
    <p id="averagePickerHint">Red = target. Tap photos to average into it.</p>
    <div id="averagePickerGrid"></div>
    <div id="cropButtons">
      <button id="averagePickerSelectAll">Select all</button>
      <button id="averagePickerCancel">Cancel</button>
      <button id="averagePickerConfirm" disabled>Continue</button>
    </div>
  </div>

  <!-- Settings: segment-orientation toggle (moved from topPanel), auto-
       advance toggle, and the 8 tunable glyph-rendering constants -->
  <div id="settingsView">
    <div id="settingsScroll">
      <div class="settingsRow">
        <span class="settingsRowLabel">Segment at top</span>
        <label class="switchLabel">
          <input type="checkbox" id="segTopCheckbox" checked>
          <span class="switchTrack"><span class="switchThumb"></span></span>
        </label>
      </div>
      <div class="settingsRow">
        <span class="settingsRowLabel">Auto-advance slot after placing</span>
        <label class="switchLabel">
          <input type="checkbox" id="autoAdvanceCheckbox" checked>
          <span class="switchTrack"><span class="switchThumb"></span></span>
        </label>
      </div>
      <div id="glyphSliders"></div>
    </div>
    <div id="cropButtons">
      <button id="settingsClose">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ==================== TABLE OF CONTENTS ====================
  // 1. Shared state           - images[], pointsByImage, activeIndex, etc.
  // 2. DOM refs                - every element lookup, in one place
  // 3. Segment geometry        - centroid/wedge/center-zone math (step 12)
  // 4. Notation assembly       - point/segment state -> [A,R,L] string (step 14)
  // 5. Main Canvas rendering   - renderMainCanvas, swipe, placePoint, toast
  // 6. Glyph renderer          - Glyph namespace, ported from the official tool
  // 7. Export                  - map/composite canvas renderer, zip/CSV build
  // 8. Glyph bar               - render + tap-to-navigate + long-press-reorder
  // 9. Point interaction       - stacking, crossing, createPointMarker+helpers
  // 10. X (delete/undo-merged), commit, slot selection, Clear All/segment-top
  // 11. Modal orchestration + file picking / crop carousel
  // 12. Lifecycle              - beforeunload warning, init
  // =============================================================

  const CROP_SIZE = 280;
  const SOFT_CAP = 20;

  // ---- Shared state: array of { id, src } — src is a baked square dataURL ----
  let images = []; // { id, src }
  let activeIndex = 0;
  // pointsByImage[imageId] = { A: [{x,y}], R: [{x,y}], L: [{x,y}] } — x/y are fractions (0-1)
  // Step 3: visual only, single point per slot, no drag/commit/geometry yet.
  let pointsByImage = {};
  // §15 step 8: per-target-image flat scatter of every raw point that went
  // into its averaged map (target's own original + every consumed source's),
  // keyed by target image id. Rendered as a faint layer beneath the normal
  // markers. Not cleared by anything yet — revisit once step 9 (removal) exists.
  let ghostPointsByImage = {};
  let placeSeq = 0; // increments on every new point placed, across all slots/images

  // ==================== DOM ====================
  const clearAllBtn = document.getElementById('clearAllBtn');
  const segTopCheckbox = document.getElementById('segTopCheckbox');
  const mainCanvasWrap = document.getElementById('mainCanvasWrap');
  const mainCanvasTrack = document.getElementById('mainCanvasTrack');
  const emptyState = document.getElementById('emptyState');
  const deleteActiveBtn = document.getElementById('deleteActiveBtn');
  const averageBtn = document.getElementById('averageBtn');
  const mirrorAverageBtn = document.getElementById('mirrorAverageBtn');
  const slotButtonsEl = document.getElementById('slotButtons');
  const slotBtnEls = Array.from(document.querySelectorAll('.slotBtn'));
  const dotsEl = document.getElementById('dots');
  const patternNameInput = document.getElementById('patternNameInput');
  const glyphBarEl = document.getElementById('glyphBar');
  const cameraBtn = document.getElementById('cameraBtn');
  const commitBtn = document.getElementById('commitBtn');
  const exportBtn = document.getElementById('exportBtn');
  const fileInput = document.getElementById('fileInput');

  const modalOverlay = document.getElementById('modalOverlay');

  const mirrorPickerView = document.getElementById('mirrorPickerView');
  const mirrorPickerGrid = document.getElementById('mirrorPickerGrid');
  const mirrorPickerCancel = document.getElementById('mirrorPickerCancel');
  const mirrorPickerConfirm = document.getElementById('mirrorPickerConfirm');

  const averagePickerView = document.getElementById('averagePickerView');
  const averagePickerGrid = document.getElementById('averagePickerGrid');
  const averagePickerSelectAll = document.getElementById('averagePickerSelectAll');
  const averagePickerCancel = document.getElementById('averagePickerCancel');
  const averagePickerConfirm = document.getElementById('averagePickerConfirm');

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsView = document.getElementById('settingsView');
  const settingsClose = document.getElementById('settingsClose');
  const autoAdvanceCheckbox = document.getElementById('autoAdvanceCheckbox');
  const glyphSlidersEl = document.getElementById('glyphSliders');

  const cropView = document.getElementById('cropView');
  const cropIndicator = document.getElementById('cropIndicator');
  const cropCanvas = document.getElementById('cropCanvas');
  const cctx = cropCanvas.getContext('2d');
  const cropPrev = document.getElementById('cropPrev');
  const cropNext = document.getElementById('cropNext');
  const cropCancelAll = document.getElementById('cropCancelAll');
  const cropApplyAll = document.getElementById('cropApplyAll');
  const cropConfirmAll = document.getElementById('cropConfirmAll');

  let uid = 1;
  const newId = () => 'img' + (uid++);

  // ==================== Segment geometry (step 12) ====================
  // Ported from composite-mapper-30.html's computeGeometry/classifyPoint,
  // including the center-zone classification found in that file. Fixed at
  // 6 segments for now (per note #5).
  const SEGMENTS = 6;
  const BOUNDARY_EPSILON = 1e-9;
  const CENTER_ZONE_FRACTION = 0.33; // fixed default — slider removed
  let SEGMENT_AT_TOP = true; // top-left switch — shifts a segment's center to 12 o'clock, defaults on

  function computeGeometryForImage(imgId) {
    const pts = pointsByImage[imgId];
    if (!pts) return null;
    const balls = [];
    ['A', 'R', 'L'].forEach(s => pts[s].forEach(p => balls.push({ x: p.x, y: p.y })));
    // Matches composite-mapper-30.html's draw(): geometry only exists once
    // the full 3-ball budget is placed across at least 2 distinct locations
    // — not just "some points exist." A single point (or a lone stack) has
    // no meaningful centroid/wedge to show yet.
    if (balls.length < 2 || getTotalBallCount(imgId) !== BALL_BUDGET) return null;
    const cx = balls.reduce((s, b) => s + b.x, 0) / balls.length;
    const cy = balls.reduce((s, b) => s + b.y, 0) / balls.length;
    let maxDist = 0;
    balls.forEach(b => { const d = Math.hypot(b.x - cx, b.y - cy); if (d > maxDist) maxDist = d; });
    const step = (Math.PI * 2) / SEGMENTS;
    const offset = SEGMENT_AT_TOP ? step / 2 : 0;
    return { cx, cy, maxDist, step, offset };
  }

  function classifySegment(p, geometry) {
    const dx = p.x - geometry.cx;
    const dy = p.y - geometry.cy;
    if (geometry.maxDist > 0 && Math.hypot(dx, dy) < geometry.maxDist * CENTER_ZONE_FRACTION) {
      return 'center';
    }
    const theta = Math.atan2(dy, dx);
    let phi = -Math.PI / 2 - theta + geometry.offset;
    phi = ((phi % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const raw = phi / geometry.step;
    const isBoundary = Math.abs(raw - Math.round(raw)) < BOUNDARY_EPSILON;
    return isBoundary ? (Math.round(raw) % SEGMENTS) + 1 : Math.floor(raw) + 1;
  }

  // assigns p.seg on every point for this image, based on the live centroid
  // of all currently placed points
  function updateSegmentsForImage(imgId, geometry) {
    const pts = pointsByImage[imgId];
    if (!pts) return;
    ['A', 'R', 'L'].forEach(s => pts[s].forEach(p => {
      p.seg = geometry ? classifySegment(p, geometry) : null;
    }));
  }

  // Outer boundary circle, centroid dot, 6 wedge divider lines, and the
  // dashed center-zone boundary — same geometry as the original app,
  // ported to SVG.
  // §15 step 8 (part 2): faint, non-interactive scatter of every raw point
  // that contributed to this image's averaged map (only exists once ≈ has
  // been used on this image — undefined for every other image). Plain divs,
  // not createPointMarker — these aren't editable points, just a visual.
  function buildGhostLayer(imgId) {
    const ghost = ghostPointsByImage[imgId];
    if (!ghost) return null;
    const layer = document.createElement('div');
    layer.className = 'ghostLayer';
    ['A', 'R', 'L'].forEach(slot => {
      ghost[slot].forEach(pt => {
        const dot = document.createElement('div');
        dot.className = 'ghostDot slot-' + slot;
        dot.style.left = (pt.x * 100) + '%';
        dot.style.top = (pt.y * 100) + '%';
        layer.appendChild(dot);
      });
    });
    return layer;
  }

  function buildGeometryOverlay(imgId, geometry) {
    if (!geometry) return null;
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'geometryOverlay');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');

    const cx = geometry.cx * 100, cy = geometry.cy * 100;
    const maxDistPct = geometry.maxDist * 100;

    // outer boundary circle (this was missing — the circumscribed circle
    // the wedges are actually dividing, ported from the original drawCircles)
    const outer = document.createElementNS(ns, 'circle');
    outer.setAttribute('cx', cx);
    outer.setAttribute('cy', cy);
    outer.setAttribute('r', maxDistPct);
    outer.setAttribute('fill', 'none');
    outer.setAttribute('stroke', '#0040ff');
    outer.setAttribute('stroke-width', '2');
    outer.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(outer);

    for (let i = 0; i < SEGMENTS; i++) {
      const angle = -Math.PI / 2 + geometry.offset + i * geometry.step;
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', cx);
      line.setAttribute('y1', cy);
      line.setAttribute('x2', cx + maxDistPct * Math.cos(angle));
      line.setAttribute('y2', cy + maxDistPct * Math.sin(angle));
      line.setAttribute('stroke', '#ff9900');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('stroke-opacity', '0.85');
      line.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(line);
    }

    const czCircle = document.createElementNS(ns, 'circle');
    czCircle.setAttribute('cx', cx);
    czCircle.setAttribute('cy', cy);
    czCircle.setAttribute('r', maxDistPct * CENTER_ZONE_FRACTION);
    czCircle.setAttribute('fill', 'none');
    czCircle.setAttribute('stroke', '#aa00aa');
    czCircle.setAttribute('stroke-width', '1.5');
    czCircle.setAttribute('stroke-dasharray', '3,2');
    czCircle.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(czCircle);

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    dot.setAttribute('r', '2');
    dot.setAttribute('fill', '#ff0000');
    dot.setAttribute('stroke', '#fff');
    dot.setAttribute('stroke-width', '1');
    dot.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(dot);

    return svg;
  }

  // Connector line/triangle — placement aid only, shown once the 3-ball
  // budget is fully used. A polygon auto-closes, so 2 locations render as a
  // line (degenerate closed shape) and 3 render as a triangle, same as the
  // old composite-mapper.html's drawShape.
  function buildConnector(imgId) {
    const pts = pointsByImage[imgId];
    if (!pts) return null;
    if (getTotalBallCount(imgId) < BALL_BUDGET) return null;
    const locations = [];
    ['A', 'R', 'L'].forEach(s => pts[s].forEach(p => locations.push(p)));
    if (locations.length < 2) return null; // single spot — nothing to connect

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'connectorOverlay');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    const pointsAttr = locations.map(p => (p.x * 100) + ',' + (p.y * 100)).join(' ');

    [{ stroke: '#fff', width: 6 }, { stroke: '#000', width: 2.5 }].forEach(cfg => {
      const poly = document.createElementNS(ns, 'polygon');
      poly.setAttribute('points', pointsAttr);
      poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', cfg.stroke);
      poly.setAttribute('stroke-width', cfg.width);
      poly.setAttribute('stroke-linejoin', 'round');
      poly.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(poly);
    });
    return svg;
  }

  // Rebuilds just the connector + geometry overlays for the currently
  // visible slide, without touching any marker DOM nodes — used during a
  // live drag so the wrap's own pointer capture is never disturbed (a full
  // renderMainCanvas() mid-drag would destroy the very marker being dragged).
  function refreshOverlaysForActiveSlide() {
    const rec = images[activeIndex];
    if (!rec) return;
    const slideEl = mainCanvasTrack.children[activeIndex];
    if (!slideEl) return;
    const geometry = computeGeometryForImage(rec.id);
    updateSegmentsForImage(rec.id, geometry);
    slideEl.querySelectorAll('.connectorOverlay, .geometryOverlay').forEach(el => el.remove());
    const overlayEl = slideEl.querySelector('.pointsOverlay');
    const geoSvg = buildGeometryOverlay(rec.id, geometry);
    if (geoSvg) slideEl.insertBefore(geoSvg, overlayEl);
    const connSvg = buildConnector(rec.id);
    if (connSvg) slideEl.insertBefore(connSvg, overlayEl);
  }

  // ==================== Notation assembly (step 14) ====================
  // Converts the current point/segment/stack/crossing state into the
  // [A,R,L] grammar string, per glyph-translator-official.html's parser.
  // Returns { notation } on success, or { error } if the current config
  // can't be validly notated (e.g. 3 real distinct taps all landing in the
  // same wedge — a legitimate placement, but indistinguishable from full
  // collapse under the grammar, which requires # for that case instead).
  function assembleNotation(imgId) {
    const pts = pointsByImage[imgId];
    if (!pts || getTotalBallCount(imgId) !== BALL_BUDGET) {
      return { error: 'Position is incomplete — needs all 3 balls placed.' };
    }

    const segToken = seg => (seg === 'center' ? 'c' : String(seg));

    // ---- A ----
    const aMentions = [];
    pts.A.forEach(p => {
      for (let i = 0; i < (p.count || 1); i++) aMentions.push(segToken(p.seg));
    });
    let aStr;
    if (aMentions.length === 0) {
      aStr = '0';
    } else if (aMentions.length === 1) {
      aStr = aMentions[0];
    } else if (aMentions.length === 2) {
      aStr = (aMentions[0] === aMentions[1]) ? (aMentions[0] + '\u00b2') : `{${aMentions[0]},${aMentions[1]}}`;
    } else {
      if (aMentions[0] === aMentions[1] && aMentions[1] === aMentions[2]) {
        return { error: 'All 3 balls landed at the same spot in A — needs # instead. Try double-tapping one point to collapse it, or spread them out.' };
      }
      aStr = `{${aMentions[0]},${aMentions[1]},${aMentions[2]}}`;
    }

    // ---- R/L ----
    function handToken(p) {
      if (!p) return '0';
      const cross = p.crossed ? '^' : '';
      if ((p.count || 1) >= 3) return cross + '#';
      return cross + segToken(p.seg) + ((p.count || 1) === 2 ? '\u00b2' : '');
    }
    const rPt = pts.R[0], lPt = pts.L[0];
    if (rPt && rPt.crossed && lPt && lPt.crossed) {
      return { error: 'Both hands are marked crossed — only one can be on top.' };
    }
    const rStr = handToken(rPt);
    const lStr = handToken(lPt);

    // ---- no single location holds all 3, across every slot combined ----
    const segCounts = {};
    pts.A.forEach(p => { segCounts[segToken(p.seg)] = (segCounts[segToken(p.seg)] || 0) + (p.count || 1); });
    if (rPt) segCounts[segToken(rPt.seg)] = (segCounts[segToken(rPt.seg)] || 0) + (rPt.count || 1);
    if (lPt) segCounts[segToken(lPt.seg)] = (segCounts[segToken(lPt.seg)] || 0) + (lPt.count || 1);
    for (const k in segCounts) {
      if (segCounts[k] === 3) {
        return { error: 'All 3 balls ended up at the same location — needs # instead. Adjust placement before committing.' };
      }
    }

    return { notation: `[${aStr},${rStr},${lStr}]` };
  }

  // ==================== Main Canvas rendering ====================
  function renderMainCanvas() {
    mainCanvasTrack.innerHTML = '';
    images.forEach(rec => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.dataset.imgId = rec.id;
      const img = document.createElement('img');
      img.src = rec.src;
      slide.appendChild(img);

      const geometry = computeGeometryForImage(rec.id);
      updateSegmentsForImage(rec.id, geometry);

      const geoOverlay = buildGeometryOverlay(rec.id, geometry);
      if (geoOverlay) slide.appendChild(geoOverlay);

      const connector = buildConnector(rec.id);
      if (connector) slide.appendChild(connector);

      const ghostLayer = buildGhostLayer(rec.id);
      if (ghostLayer) slide.appendChild(ghostLayer);

      const overlay = document.createElement('div');
      overlay.className = 'pointsOverlay';
      const pts = pointsByImage[rec.id];
      if (pts) {
        ['A', 'R', 'L'].forEach(slot => {
          (pts[slot] || []).forEach((p, idx) => {
            overlay.appendChild(createPointMarker(rec.id, slot, idx, p, rec.locked));
          });
        });
      }
      slide.appendChild(overlay);

      mainCanvasTrack.appendChild(slide);
    });

    if (images.length === 0) {
      activeIndex = 0;
      emptyState.style.display = 'flex';
      activeSlot = null;
      slotBtnEls.forEach(b => b.classList.remove('active'));
    } else {
      activeIndex = Math.max(0, Math.min(activeIndex, images.length - 1));
      emptyState.style.display = 'none';
    }
    positionTrack(false);
    renderDots();
    renderGlyphBar();

    updateTopButtonStates();
  }

  // commitBtn/averageBtn disabled state depends only on activeIndex/images —
  // needs recalculating on navigation (swipe, dot-tap) too, not just full
  // re-renders, otherwise it goes stale (reply 9).
  function updateTopButtonStates() {
    const activeRec = images[activeIndex];
    commitBtn.disabled = !activeRec || activeRec.locked || getTotalBallCount(activeRec.id) !== BALL_BUDGET;
    // Updated for the picker (Reply 140/145): target can now be any image,
    // sources any other unlocked image — not just "later in sequence" like
    // the original §15 design. Same gate as mirror-average now.
    averageBtn.disabled = !activeRec || images.filter(r => !r.locked).length < 2;
    // Mirror-average step 1: gated only on "2+ unlocked images exist
    // somewhere" — unlike Average, not tied to sequence position (Reply 104).
    // Picker/precondition/validation are later steps, not implemented here yet.
    mirrorAverageBtn.disabled = images.filter(r => !r.locked).length < 2;
  }

  // §15 step 2, generalized per §140 step 3 (Reply 147): now checks target
  // + an explicit sourceIds list, not an index range — works for any
  // picker selection, contiguous or not, before or after target.
  function findFirstIncompleteAmongIds(targetId, sourceIds) {
    const ids = [targetId, ...sourceIds];
    for (const id of ids) {
      if (getTotalBallCount(id) !== BALL_BUDGET) return images.findIndex(r => r.id === id) + 1; // 1-based, matches glyph-bar badges
    }
    return null;
  }

  // §15 step 3: mismatch validation vs. the target image (the one Average
  // was pressed on), across the rest of the range. Warn-not-block per §15 —
  // the user can choose to proceed anyway. Three categories:
  //  - ball-count-per-slot: total balls in a slot differs from target
  //  - crossing: which hand (if any) is marked crossed differs from target
  //  - stack-shape-per-index: same per-slot total, but stack (p.count) sits
  //    at a different array index than in target — added per Reply 3, not
  //    in §15's original text
  function slotBallCounts(imgId) {
    const pts = pointsByImage[imgId];
    const out = {};
    ['A', 'R', 'L'].forEach(s => { out[s] = pts[s].reduce((sum, p) => sum + (p.count || 1), 0); });
    return out;
  }

  function crossedSlotOf(imgId) {
    const pts = pointsByImage[imgId];
    if (pts.R[0] && pts.R[0].crossed) return 'R';
    if (pts.L[0] && pts.L[0].crossed) return 'L';
    return null;
  }

  function stackShapeOf(imgId) {
    const pts = pointsByImage[imgId];
    const out = {};
    ['A', 'R', 'L'].forEach(s => { out[s] = pts[s].map(p => p.count || 1); });
    return out;
  }

  function findMismatchesAmong(targetId, sourceIds) {
    const targetCounts = slotBallCounts(targetId);
    const targetCrossed = crossedSlotOf(targetId);
    const targetShape = stackShapeOf(targetId);
    const mismatches = [];

    sourceIds.forEach(id => {
      const pos = images.findIndex(r => r.id === id) + 1;
      const counts = slotBallCounts(id);
      ['A', 'R', 'L'].forEach(s => {
        if (counts[s] !== targetCounts[s]) {
          mismatches.push(`Photo ${pos}: ${s} has ${counts[s]} ball(s), target has ${targetCounts[s]}`);
        }
      });

      const crossed = crossedSlotOf(id);
      if (crossed !== targetCrossed) {
        mismatches.push(`Photo ${pos}: crossed hand is ${crossed || 'none'}, target is ${targetCrossed || 'none'}`);
      }

      const shape = stackShapeOf(id);
      ['A', 'R', 'L'].forEach(s => {
        if (counts[s] === targetCounts[s] && shape[s].length === targetShape[s].length) {
          shape[s].forEach((c, idx) => {
            if (c !== targetShape[s][idx]) {
              mismatches.push(`Photo ${pos}: ${s}[${idx}] is a stack of ${c}, target's is ${targetShape[s][idx]}`);
            }
          });
        }
      });
    });
    return mismatches;
  }

  // §15 steps 4-6: pure averaging math, deliberately not wired into the
  // click handler yet (steps 7-9 do that). No DOM, no rendering, no
  // image-removal — just point-cloud in, averaged polar values out.

  // Step 4: convert one photo's points into that photo's own polar space
  // (its own centroid/maxDist, same convention as computeGeometryForImage/
  // classifySegment — atan2(dy,dx), radius as a fraction of that photo's
  // own maxDist). One polar entry per array index (per marked location),
  // not per ball — a stack is still one entry with count>1, matching how
  // A-index correspondence across photos was defined earlier.
  // Shared by imageToPolarPoints, gatherMirrorSamples(AtIndex) — was
  // triplicated across all three before this refactor (Reply 163/164 step 1).
  function toPolar(geo, x, y) {
    const dx = x - geo.cx, dy = y - geo.cy;
    return {
      angle: Math.atan2(dy, dx),
      radiusFrac: geo.maxDist > 0 ? Math.hypot(dx, dy) / geo.maxDist : 0
    };
  }

  function imageToPolarPoints(imgId) {
    const geo = computeGeometryForImage(imgId);
    if (!geo) return null;
    const pts = pointsByImage[imgId];
    const out = {};
    ['A', 'R', 'L'].forEach(s => {
      out[s] = pts[s].map((p, idx) => {
        const polar = toPolar(geo, p.x, p.y);
        return {
          idx,
          angle: polar.angle,
          radiusFrac: polar.radiusFrac,
          count: p.count || 1,
          crossed: !!p.crossed
        };
      });
    });
    return out;
  }

  // Step 5 (math half): circular mean via vector sum, not plain averaging —
  // handles the 0°/360° wrap by construction (Reply 19). resultantLength
  // (0-1) doubles as the angle-accuracy figure: 1 = angles tightly
  // clustered, 0 = scattered or diametrically split.
  function circularMean(angles) {
    if (!angles.length) return { angle: 0, resultantLength: 0 };
    let sumSin = 0, sumCos = 0;
    angles.forEach(a => { sumSin += Math.sin(a); sumCos += Math.cos(a); });
    const n = angles.length;
    const meanSin = sumSin / n, meanCos = sumCos / n;
    return { angle: Math.atan2(meanSin, meanCos), resultantLength: Math.hypot(meanSin, meanCos) };
  }

  function mean(nums) { return nums.reduce((s, n) => s + n, 0) / nums.length; }

  function coefficientOfVariation(nums) {
    const m = mean(nums);
    if (m === 0) return 0;
    const variance = mean(nums.map(n => (n - m) * (n - m)));
    return Math.sqrt(variance) / m;
  }

  // Step 6: match target + sources by slot/index (R/L trivial, A by index —
  // already validated/marking-order-matched in step 3), circular-mean the
  // angles, plain-mean the radii, keep the two accuracy figures separate
  // per Reply 18 (not combined into one Cartesian average). count/crossed
  // are carried over from target as the reference value.
  function averageMatchedPoints(targetId, sourceIds) {
    const allIds = [targetId, ...sourceIds];
    const polarByImage = {};
    for (const id of allIds) {
      const p = imageToPolarPoints(id);
      if (!p) return null; // shouldn't happen — step 2 already checked completeness
      polarByImage[id] = p;
    }
    const targetPolar = polarByImage[targetId];
    const result = {};
    ['A', 'R', 'L'].forEach(slot => {
      result[slot] = targetPolar[slot].map((_, idx) => {
        const angles = allIds.map(id => polarByImage[id][slot][idx].angle);
        const radii = allIds.map(id => polarByImage[id][slot][idx].radiusFrac);
        const { angle, resultantLength } = circularMean(angles);
        const radiusCV = coefficientOfVariation(radii);
        return {
          idx,
          angle,
          radiusFrac: mean(radii),
          angleAccuracy: resultantLength,
          radiusAccuracy: 1 - Math.min(radiusCV, 1),
          count: targetPolar[slot][idx].count,
          crossed: targetPolar[slot][idx].crossed
        };
      });
    });
    return result;
  }

  // §140 step 1: existing average logic extracted into a reusable function,
  // so the future picker (step 2) can call it with an arbitrary source list
  // instead of only "everything after target." Behavior is unchanged for
  // now — the button below still computes sourceIds the old way (Reply
  // 24-49's sequential range) until the picker replaces that. Removal
  // (currently a contiguous splice) is step 8, not touched here.
  // Reverse of toPolar — pairs with it, used by both write-back and ghost
  // snapshot below (previously duplicated inline twice, same formula each time).
  function fromPolar(geo, angle, radiusFrac) {
    return {
      x: geo.cx + Math.cos(angle) * radiusFrac * geo.maxDist,
      y: geo.cy + Math.sin(angle) * radiusFrac * geo.maxDist
    };
  }

  // §15 step 2/3: precondition + mismatch confirm, run before touching any
  // data. Returns false if the average should NOT proceed (either blocked
  // outright, or the user declined the mismatch-override prompt).
  function confirmAverageCanProceed(targetId, sourceIds) {
    const badPos = findFirstIncompleteAmongIds(targetId, sourceIds);
    if (badPos !== null) {
      showToast(`Photo ${badPos} doesn't have all 3 balls placed yet`);
      return false;
    }
    const mismatches = findMismatchesAmong(targetId, sourceIds);
    if (mismatches.length > 0) {
      // Placeholder confirm() dialog — not styled to match the app yet;
      // fine for testing the validation logic, worth revisiting as a
      // proper in-app banner before this ships for real.
      if (!confirm(mismatches.join('\n') + '\n\nAverage anyway?')) return false;
    }
    return true;
  }

  // §15 step 8 (part 1): snapshot every raw contributing point — target's
  // own pre-average position plus every source's — before target's own
  // points get overwritten. MUST run before writeAveragedPointsBack, since
  // it reads target's points in their pre-average state. Target counts as
  // one of the N samples in the average (averageMatchedPoints includes it
  // via allIds), so its own original mark belongs in the "undifferentiated
  // scatter" too, not just the sources'.
  //
  // Bug caught in testing (Reply 34): source points were being stored using
  // their own raw x/y and plotted straight onto the target's canvas — wrong,
  // since each photo has its own centroid/scale. Fixed by reprojecting each
  // source point through its own polar space and back out using targetGeo.
  function buildAverageGhostCloud(targetId, sourceIds, targetGeo) {
    const ghost = { A: [], R: [], L: [] };
    pointsByImage[targetId] && ['A', 'R', 'L'].forEach(slot => {
      pointsByImage[targetId][slot].forEach((p, idx) => ghost[slot].push({ x: p.x, y: p.y, sourceIdx: idx }));
    });
    sourceIds.forEach(id => {
      const sourcePolar = imageToPolarPoints(id);
      ['A', 'R', 'L'].forEach(slot => {
        sourcePolar[slot].forEach(entry => {
          const xy = fromPolar(targetGeo, entry.angle, entry.radiusFrac);
          ghost[slot].push({ x: xy.x, y: xy.y, sourceIdx: entry.idx });
        });
      });
    });
    ghostPointsByImage[targetId] = ghost;
  }

  // §15 step 7: convert averaged polar values back to x/y and write them
  // into the target's own points, in place. targetGeo must be the SAME
  // frame averageMatchedPoints used internally, captured before any
  // mutation — not recomputed after.
  function writeAveragedPointsBack(targetId, sourceIds, targetGeo) {
    const averaged = averageMatchedPoints(targetId, sourceIds);
    ['A', 'R', 'L'].forEach(slot => {
      averaged[slot].forEach((entry, idx) => {
        const p = pointsByImage[targetId][slot][idx];
        const xy = fromPolar(targetGeo, entry.angle, entry.radiusFrac);
        p.x = xy.x;
        p.y = xy.y;
        // count/crossed/seq/committed untouched — averaged values only ever
        // carried target's own count/crossed through (Reply 20/step 6),
        // nothing to write back for those.
      });
    });
  }

  // §140 step 8: id-based removal (fixed from the old contiguous-splice
  // bug — Reply 149). activeIndex recomputed afterward since a source
  // before target shifts target's own array position.
  function removeConsumedSourcePhotos(targetId, sourceIds) {
    images = images.filter(r => !sourceIds.includes(r.id));
    activeIndex = images.findIndex(r => r.id === targetId);
    sourceIds.forEach(id => { delete pointsByImage[id]; });
  }

  function runAverage(targetId, sourceIds) {
    if (!confirmAverageCanProceed(targetId, sourceIds)) return;

    const targetGeo = computeGeometryForImage(targetId);
    buildAverageGhostCloud(targetId, sourceIds, targetGeo); // before write-back — reads target's pre-average points
    writeAveragedPointsBack(targetId, sourceIds, targetGeo);
    removeConsumedSourcePhotos(targetId, sourceIds);

    renderMainCanvas(); // recomputes segments/geometry for the new positions, redraws with the ghost scatter, and refreshes dots/glyph-bar/button states for the now-shorter images[] — all handled by renderMainCanvas's existing tail
    showToast(`Averaged into this photo and removed ${sourceIds.length} consumed photo(s)`);
  }

  // §140 step 2: picker modal — target fixed to the active image at tap
  // time (Reply 139), any number of other unlocked images tappable as
  // sources, no cap. Confirm calls runAverage (step 1) with whatever was
  // selected — same function, arbitrary source list instead of only
  // "everything after target."
  let averageTargetId = null;
  let averageSourceIds = [];

  // Shared by the Average and mirror-average pickers (Reply 163/164 step 4)
  // — was two near-identical thumbnail-grid builders before this. config:
  //   gridEl, confirmBtn: the DOM elements for this picker
  //   targetId: fixed non-deselectable red thumbnail, or null (mirror has none)
  //   selected: the source/selection array, mutated in place
  //   maxSelected: cap with oldest-bumped-on-overflow, or null for unlimited
  //   numberedBadges: true = show 1/2/3... (mirror), false = plain colored border (Average sources)
  function renderPickerGrid(config) {
    const { gridEl, confirmBtn, targetId, selected, maxSelected, numberedBadges } = config;
    gridEl.innerHTML = '';
    images.filter(r => !r.locked).forEach(rec => {
      const isTarget = !!targetId && rec.id === targetId;
      const isSelected = selected.includes(rec.id);
      const thumb = document.createElement('div');
      thumb.className = 'mirrorThumb' + (isTarget ? ' target' : (isSelected ? ' selected' : ''));
      const img = document.createElement('img');
      img.src = rec.src;
      thumb.appendChild(img);

      if (isTarget) {
        const badge = document.createElement('div');
        badge.className = 'mirrorThumbBadge target';
        badge.textContent = 'T';
        thumb.appendChild(badge);
      } else if (isSelected && numberedBadges) {
        const badge = document.createElement('div');
        badge.className = 'mirrorThumbBadge';
        badge.textContent = selected.indexOf(rec.id) + 1;
        thumb.appendChild(badge);
      }

      if (!isTarget) {
        thumb.addEventListener('click', () => {
          const i = selected.indexOf(rec.id);
          if (i !== -1) {
            selected.splice(i, 1);
          } else {
            selected.push(rec.id);
            if (maxSelected && selected.length > maxSelected) selected.shift(); // oldest bumped
          }
          renderPickerGrid(config);
        });
      }
      gridEl.appendChild(thumb);
    });
    confirmBtn.disabled = maxSelected ? selected.length !== maxSelected : selected.length === 0;
  }

  averageBtn.addEventListener('click', () => {
    averageTargetId = images[activeIndex].id;
    averageSourceIds = [];
    renderPickerGrid({ gridEl: averagePickerGrid, confirmBtn: averagePickerConfirm, targetId: averageTargetId, selected: averageSourceIds, maxSelected: null, numberedBadges: false });
    cropView.classList.remove('active');
    averagePickerView.classList.add('active');
    modalOverlay.classList.add('open');
  });

  averagePickerSelectAll.addEventListener('click', () => {
    averageSourceIds = images.filter(r => !r.locked && r.id !== averageTargetId).map(r => r.id);
    renderPickerGrid({ gridEl: averagePickerGrid, confirmBtn: averagePickerConfirm, targetId: averageTargetId, selected: averageSourceIds, maxSelected: null, numberedBadges: false });
  });

  averagePickerCancel.addEventListener('click', () => {
    modalOverlay.classList.remove('open');
    averagePickerView.classList.remove('active');
  });

  averagePickerConfirm.addEventListener('click', () => {
    modalOverlay.classList.remove('open');
    averagePickerView.classList.remove('active');
    runAverage(averageTargetId, averageSourceIds);
  });

  // ==================== Mirror-average picker ====================
  // Reply 104-109: select exactly 2 unlocked images. Active image pre-fills
  // one slot (Reply 106 Q3).
  let mirrorSelected = []; // array of image ids, oldest-first, max 2

  mirrorAverageBtn.addEventListener('click', () => {
    const activeRec = images[activeIndex];
    mirrorSelected = (activeRec && !activeRec.locked) ? [activeRec.id] : [];
    renderPickerGrid({ gridEl: mirrorPickerGrid, confirmBtn: mirrorPickerConfirm, targetId: null, selected: mirrorSelected, maxSelected: 2, numberedBadges: true });
    cropView.classList.remove('active');
    mirrorPickerView.classList.add('active');
    modalOverlay.classList.add('open');
  });

  mirrorPickerCancel.addEventListener('click', () => {
    modalOverlay.classList.remove('open');
    mirrorPickerView.classList.remove('active');
  });

  // §109 step 3: both selected images must have a complete map. Applied to
  // just these two specific ids, not a range — reuses the same
  // getTotalBallCount check the regular Average feature's precondition uses.
  function findAllIncompleteAmongIds(ids) {
    return ids
      .map(id => images.findIndex(r => r.id === id) + 1) // 1-based, matches glyph-bar badges
      .filter((pos, i) => getTotalBallCount(ids[i]) !== BALL_BUDGET);
  }

  // §109 step 4: same three mismatch categories as regular Average, but
  // cross-slot per the mirror mapping (Reply 103/104) — R compares against
  // the OTHER image's L, L against its R, A against A directly. Reuses the
  // existing slotBallCounts/crossedSlotOf/stackShapeOf helpers, just paired
  // differently. Warn-not-block, same confirm() placeholder as Average.
  const MIRROR_SLOT = { A: 'A', R: 'L', L: 'R' };
  function findMirrorMismatches(id1, id2) {
    const counts1 = slotBallCounts(id1), counts2 = slotBallCounts(id2);
    const shape1 = stackShapeOf(id1), shape2 = stackShapeOf(id2);
    const mismatches = [];
    ['A', 'R', 'L'].forEach(slot => {
      const otherSlot = MIRROR_SLOT[slot];
      if (counts1[slot] !== counts2[otherSlot]) {
        mismatches.push(`${slot} (photo 1) has ${counts1[slot]} ball(s), mirrored ${otherSlot} (photo 2) has ${counts2[otherSlot]}`);
      } else if (shape1[slot].length === shape2[otherSlot].length) {
        shape1[slot].forEach((c, idx) => {
          if (c !== shape2[otherSlot][idx]) {
            mismatches.push(`${slot}[${idx}] (photo 1) is a stack of ${c}, mirrored ${otherSlot}[${idx}] (photo 2) is ${shape2[otherSlot][idx]}`);
          }
        });
      }
    });
    const crossed1 = crossedSlotOf(id1), crossed2 = crossedSlotOf(id2);
    const crossed2Mirrored = crossed2 ? MIRROR_SLOT[crossed2] : null;
    if (crossed1 !== crossed2Mirrored) {
      mismatches.push(`crossed hand is ${crossed1 || 'none'} (photo 1), mirrored crossed hand is ${crossed2Mirrored || 'none'} (photo 2)`);
    }
    return mismatches;
  }

  // §109 step 6: for each image, build its full sample pool per slot — its
  // own samples (step 5) plus the OTHER image's samples, reflected
  // (angle -> π-angle, radius unchanged) and cross-assigned per MIRROR_SLOT
  // (R<-L, L<-R, A<-A). Still no averaging here — this is the combined pool
  // step 7 will actually average.
  function reflectAngle(angle) {
    let a = Math.PI - angle;
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a <= -Math.PI) a += 2 * Math.PI;
    return a;
  }

  // §109 step 6 (revised per Reply 130-132): per-index pairing, same-index
  // correspondence between the two images (reversed-index and 3+-air-ball
  // handling noted for futures, Reply 132 — not built). For a given
  // (image, slot, index), gathers just that point's own samples — its
  // current position plus any ghost dots whose sourceIdx matches — not the
  // whole slot pooled together.
  function gatherMirrorSamplesAtIndex(imgId, slot, idx) {
    const geo = computeGeometryForImage(imgId);
    if (!geo) return [];
    const samples = [];
    const p = pointsByImage[imgId][slot][idx];
    if (p) samples.push(toPolar(geo, p.x, p.y));
    const ghost = ghostPointsByImage[imgId];
    if (ghost && ghost[slot]) {
      ghost[slot].filter(pt => pt.sourceIdx === idx).forEach(pt => {
        samples.push(toPolar(geo, pt.x, pt.y));
      });
    }
    return samples;
  }

  // A hard precondition (Reply 131) — unequal A-array lengths have no valid
  // same-index pairing at all, unlike the warn-and-proceed mismatches.
  function findAIndexMismatch(idA, idB) {
    return pointsByImage[idA].A.length !== pointsByImage[idB].A.length;
  }

  // Builds, for each image, a per-slot array of per-index sample sets: this
  // point's native samples (own current + own ghost at this index) plus the
  // other image's samples at the SAME index, mirrored (Reply 132).
  function buildIndexedMirrorPool(idA, idB) {
    const pool = {};
    [[idA, idB], [idB, idA]].forEach(([selfId, otherId]) => {
      pool[selfId] = {};
      ['A', 'R', 'L'].forEach(slot => {
        const otherSlot = MIRROR_SLOT[slot];
        const length = pointsByImage[selfId][slot].length;
        pool[selfId][slot] = [];
        for (let i = 0; i < length; i++) {
          const native = gatherMirrorSamplesAtIndex(selfId, slot, i);
          const foreignRaw = gatherMirrorSamplesAtIndex(otherId, otherSlot, i);
          const foreign = foreignRaw.map(s => ({ angle: reflectAngle(s.angle), radiusFrac: s.radiusFrac }));
          pool[selfId][slot].push(native.concat(foreign));
        }
      });
    });
    return pool;
  }

  // §109 step 7 (revised): averages each per-index sample set separately —
  // distinct A points stay distinct in the output, not blurred into one
  // (Reply 130's correction of Reply 129's earlier confusion).
  function averageIndexedMirrorPool(poolBySlot) {
    const result = {};
    ['A', 'R', 'L'].forEach(slot => {
      result[slot] = poolBySlot[slot].map(samples => {
        if (!samples.length) return null;
        const angles = samples.map(s => s.angle), radii = samples.map(s => s.radiusFrac);
        const { angle, resultantLength } = circularMean(angles);
        return {
          angle,
          radiusFrac: mean(radii),
          angleAccuracy: resultantLength,
          radiusAccuracy: 1 - Math.min(coefficientOfVariation(radii), 1)
        };
      });
    });
    return result;
  }

  // Mirror-average precondition: incomplete photos, unequal A-array
  // lengths (hard block, no valid pairing otherwise — Reply 131), then the
  // cross-slot mismatch confirm. Returns false if the average should not
  // proceed.
  function confirmMirrorAverageCanProceed(idA, idB) {
    const badPositions = findAllIncompleteAmongIds([idA, idB]);
    if (badPositions.length > 0) {
      showToast(`Photo ${badPositions.join(' & ')} doesn't have all 3 balls placed yet`);
      return false;
    }
    if (findAIndexMismatch(idA, idB)) {
      showToast('Both photos need the same number of A points to mirror-average — no valid pairing otherwise');
      return false;
    }
    const mismatches = findMirrorMismatches(idA, idB);
    if (mismatches.length > 0) {
      if (!confirm(mismatches.join('\n') + '\n\nMirror-average anyway?')) return false;
    }
    return true;
  }

  // Captures both images' own geometry BEFORE mutating either (same
  // reasoning as regular Average's targetGeo), builds the per-index sample
  // pool, and averages it. Everything downstream (write-back, ghost cloud)
  // reads from this captured snapshot, not live data — so those two steps
  // can run in either order safely.
  function computeMirrorWriteBackData(idA, idB) {
    const geoById = { [idA]: computeGeometryForImage(idA), [idB]: computeGeometryForImage(idB) };
    const pool = buildIndexedMirrorPool(idA, idB);
    const averaged = { [idA]: averageIndexedMirrorPool(pool[idA]), [idB]: averageIndexedMirrorPool(pool[idB]) };
    return { pool, averaged, geoById };
  }

  function writeMirrorAveragedPointsBack(idA, idB, averaged, geoById) {
    [idA, idB].forEach(imgId => {
      const geo = geoById[imgId];
      ['A', 'R', 'L'].forEach(slot => {
        averaged[imgId][slot].forEach((entry, idx) => {
          if (!entry) return;
          const p = pointsByImage[imgId][slot][idx];
          const xy = fromPolar(geo, entry.angle, entry.radiusFrac);
          p.x = xy.x;
          p.y = xy.y;
        });
      });
    });
  }

  // Combined ghost cloud (Reply 108/109 step 9): every individual raw
  // sample that went into each image's average — native and mirrored
  // foreign alike — converted into that image's own frame, tagged with the
  // index it belongs to. Both images end up showing the full combined
  // point cloud, per Reply 108.
  function buildMirrorGhostClouds(idA, idB, pool, geoById) {
    [idA, idB].forEach(imgId => {
      const geo = geoById[imgId];
      const newGhost = { A: [], R: [], L: [] };
      ['A', 'R', 'L'].forEach(slot => {
        pool[imgId][slot].forEach((samples, idx) => {
          samples.forEach(s => {
            const xy = fromPolar(geo, s.angle, s.radiusFrac);
            newGhost[slot].push({ x: xy.x, y: xy.y, sourceIdx: idx });
          });
        });
      });
      ghostPointsByImage[imgId] = newGhost;
    });
  }

  mirrorPickerConfirm.addEventListener('click', () => {
    const [idA, idB] = mirrorSelected;
    if (!confirmMirrorAverageCanProceed(idA, idB)) return;

    const { pool, averaged, geoById } = computeMirrorWriteBackData(idA, idB);
    writeMirrorAveragedPointsBack(idA, idB, averaged, geoById);
    buildMirrorGhostClouds(idA, idB, pool, geoById);

    modalOverlay.classList.remove('open');
    mirrorPickerView.classList.remove('active');
    renderMainCanvas();
    showToast(`Mirror-averaged photos ${mirrorSelected.map(id => images.findIndex(r => r.id === id) + 1).join(' & ')} — both updated, neither removed`);
  });

  function positionTrack(animate) {
    mainCanvasTrack.style.transition = animate ? 'transform 0.22s ease' : 'none';
    mainCanvasTrack.style.transform = `translateX(-${activeIndex * 100}%)`;
  }

  function renderDots() {
    dotsEl.innerHTML = '';
    images.forEach((_, i) => {
      const d = document.createElement('button');
      d.className = 'dot' + (i === activeIndex ? ' active' : '');
      d.setAttribute('aria-label', 'Go to photo ' + (i + 1));
      d.addEventListener('click', () => {
        activeIndex = i;
        positionTrack(true);
        renderDots();
        updateTopButtonStates();
      });
      dotsEl.appendChild(d);
    });
  }

  function goToIndex(i, animate) {
    activeIndex = Math.max(0, Math.min(i, images.length - 1));
    positionTrack(animate);
    renderDots();
    updateTopButtonStates();
  }

  // ---- swipe on main canvas ----
  const SLOT_CAP = 3; // max distinct points per slot (only reachable by A in practice)
  const NEXT_SLOT = { A: 'R', R: 'L', L: 'A' }; // auto-advance cycle after a successful placement

  function placePoint(clientX, clientY) {
    if (!activeSlot || images.length === 0) return;
    const rec = images[activeIndex];
    if (rec.locked) return; // frozen — only ↺ can unlock it
    const rect = mainCanvasWrap.getBoundingClientRect();
    const fx = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const fy = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
    if (!pointsByImage[rec.id]) pointsByImage[rec.id] = { A: [], R: [], L: [] };
    const arr = pointsByImage[rec.id][activeSlot];

    if (activeSlot === 'A') {
      // A can hold multiple distinct points, up to SLOT_CAP.
      if (arr.length >= SLOT_CAP) {
        showToast('This slot is full');
        return;
      }
      if (getTotalBallCount(rec.id) >= BALL_BUDGET) {
        showToast('All 3 balls are already placed');
        return;
      }
      arr.push({ x: fx, y: fy, committed: true, count: 1, seq: ++placeSeq });
    } else {
      // R/L: a hand can only be in one place. Placement only happens on an
      // empty slot — once occupied, tap-elsewhere is a no-op. Repositioning
      // is drag-only from here, which also means a point's `crossed` flag
      // never gets reset by a stray tap (reply 159/160).
      if (arr.length > 0) return;
      if (getTotalBallCount(rec.id) + 1 > BALL_BUDGET) {
        showToast('All 3 balls are already placed');
        return;
      }
      arr.push({ x: fx, y: fy, committed: true, count: 1, seq: ++placeSeq });
    }
    if (autoAdvanceEnabled) {
      activeSlot = NEXT_SLOT[activeSlot];
      slotBtnEls.forEach(b => b.classList.toggle('active', b.dataset.slot === activeSlot));
    }
    renderMainCanvas();
  }

  const toastEl = document.getElementById('toast');

  const GRAB_RING_EXTRA = 30; // px beyond the marker's own size — fixed, slider removed
  let toastTimer = null;
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  const BALL_BUDGET = 3; // total balls across A+R+L, per notation grammar

  function getTotalBallCount(imgId) {
    const pts = pointsByImage[imgId];
    if (!pts) return 0;
    let total = 0;
    ['A', 'R', 'L'].forEach(s => pts[s].forEach(p => { total += (p.count || 1); }));
    return total;
  }

  // ==================== Glyph renderer ====================
  // Ported wholesale from glyph-translator-official.html — same constants,
  // same parser, same drawGlyphEntry — for exact visual parity rather than
  // a reimplementation that could subtly drift from the official tool.
  // Everything below is namespaced under Glyph — only drawEntry,
  // parseNotation, and renderDataUrl are meant to be used outside this block.
  const Glyph = (function () {
  const GLYPH_SLOT_COLORS = { A: '#c0392b', R: '#e67e22', L: '#2874a6' };
  let GLYPH_RADIUS = 68;
  // Padding tunable via settings — GLYPH_SIZE/CENTER now computed from it
  // instead of fixed, same architecture as the sequence-tester (Reply:
  // "Padding doesn't map directly" — this is the resolution).
  let GLYPH_CANVAS_PADDING = 36;
  let GLYPH_SIZE = Math.round((GLYPH_RADIUS + GLYPH_CANVAS_PADDING) * 2);
  let GLYPH_CENTER = GLYPH_SIZE / 2;
  // Tunable via the settings panel (Reply: glyph-renderer defaults) —
  // let instead of const, exposed through setConst below.
  let GLYPH_DOT_RADIUS = 6;
  let GLYPH_LABEL_FONT_SIZE = 18;
  let GLYPH_LABEL_PADDING_EXTRA = 2;
  let GLYPH_LABEL_CORNER_RADIUS = 2;
  let GLYPH_FRAME_BORDER_WIDTH = 3;
  let GLYPH_CIRCLE_LINE_WIDTH = 3;
  let GLYPH_CONNECTOR_LINE_WIDTH = 5;
  const GLYPH_LABEL_MARGIN_RATIO = 0.9;
  const GLYPH_PADDING_BASE_RATIO = 0.3;
  const GLYPH_UNDERLINE_GAP_RATIO = 0.18;
  const GLYPH_UNDERLINE_THICKNESS_RATIO = 0.08;

  function glyphSegmentMidAngle(seg, step, offset) {
    return -Math.PI / 2 + offset + (seg - 0.5) * step;
  }
  function glyphSlotOrderKey(s) { return { A: 0, R: 1, L: 2 }[s]; }
  function glyphLabelFont() { return `bold ${GLYPH_LABEL_FONT_SIZE}px sans-serif`; }
  function glyphFramePadding() { return GLYPH_LABEL_FONT_SIZE * GLYPH_PADDING_BASE_RATIO + GLYPH_LABEL_PADDING_EXTRA; }

  function glyphBuildRuns(entries) {
    return entries.map(e => ({
      text: e.slot.repeat(e.count),
      color: GLYPH_SLOT_COLORS[e.slot],
      underline: e.crossed,
    }));
  }
  function glyphMeasureRuns(gctx, runs) {
    gctx.font = glyphLabelFont();
    return runs.reduce((sum, r) => sum + gctx.measureText(r.text).width, 0);
  }
  function glyphRoundRectPath(gctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    gctx.beginPath();
    gctx.moveTo(x + rr, y);
    gctx.arcTo(x + w, y, x + w, y + h, rr);
    gctx.arcTo(x + w, y + h, x, y + h, rr);
    gctx.arcTo(x, y + h, x, y, rr);
    gctx.arcTo(x, y, x + w, y, rr);
    gctx.closePath();
  }
  function glyphDrawFramedLabel(gctx, x, y, entries) {
    const runs = glyphBuildRuns(entries);
    const borderColor = entries.length === 1 ? GLYPH_SLOT_COLORS[entries[0].slot] : '#000000';
    const hasUnderline = runs.some(r => r.underline);
    const underlineGap = GLYPH_LABEL_FONT_SIZE * GLYPH_UNDERLINE_GAP_RATIO;
    const underlineThickness = Math.max(1.5, GLYPH_LABEL_FONT_SIZE * GLYPH_UNDERLINE_THICKNESS_RATIO);

    gctx.font = glyphLabelFont();
    gctx.textBaseline = 'middle';
    gctx.textAlign = 'left';
    const totalW = glyphMeasureRuns(gctx, runs);
    const pad = glyphFramePadding();

    const contentH = GLYPH_LABEL_FONT_SIZE + (hasUnderline ? underlineGap + underlineThickness : 0);
    const frameW = totalW + pad * 2;
    const frameH = contentH + pad * 2;
    const frameX = x - frameW / 2;
    const frameY = y - frameH / 2;

    glyphRoundRectPath(gctx, frameX, frameY, frameW, frameH, GLYPH_LABEL_CORNER_RADIUS);
    gctx.fillStyle = '#ffffff';
    gctx.fill();
    gctx.strokeStyle = borderColor;
    gctx.lineWidth = GLYPH_FRAME_BORDER_WIDTH;
    gctx.stroke();

    const textCenterY = frameY + pad + GLYPH_LABEL_FONT_SIZE / 2;
    let cx = x - totalW / 2;
    runs.forEach(run => {
      const w = gctx.measureText(run.text).width;
      gctx.fillStyle = run.color;
      gctx.fillText(run.text, cx, textCenterY);
      if (run.underline) {
        const uy = textCenterY + GLYPH_LABEL_FONT_SIZE / 2 + underlineGap;
        gctx.strokeStyle = run.color;
        gctx.lineWidth = underlineThickness;
        gctx.beginPath();
        gctx.moveTo(cx, uy);
        gctx.lineTo(cx + w, uy);
        gctx.stroke();
      }
      cx += w;
    });
  }

  function glyphDrawEntry(gctx, entry) {
    GLYPH_SIZE = Math.round((GLYPH_RADIUS + GLYPH_CANVAS_PADDING) * 2);
    GLYPH_CENTER = GLYPH_SIZE / 2;
    if (gctx.canvas.width !== GLYPH_SIZE) {
      gctx.canvas.width = GLYPH_SIZE;
      gctx.canvas.height = GLYPH_SIZE;
    }
    gctx.clearRect(0, 0, GLYPH_SIZE, GLYPH_SIZE);
    gctx.fillStyle = '#ffffff';
    gctx.fillRect(0, 0, GLYPH_SIZE, GLYPH_SIZE);

    const { labels, ballCounts: counts, crossingHand, step, offset } = entry;

    const rawList = [];
    labels.A.forEach(e => rawList.push({ slot: 'A', seg: e.seg, count: e.count, crossed: false }));
    ['R', 'L'].forEach(slot => {
      if (!labels[slot]) return;
      rawList.push({ slot, seg: labels[slot].seg, count: counts[slot], crossed: slot === crossingHand });
    });

    gctx.beginPath();
    gctx.arc(GLYPH_CENTER, GLYPH_CENTER, GLYPH_RADIUS, 0, Math.PI * 2);
    gctx.strokeStyle = '#000000';
    gctx.lineWidth = GLYPH_CIRCLE_LINE_WIDTH;
    gctx.stroke();
    const totalSegments = Math.round((Math.PI * 2) / step);
    gctx.fillStyle = '#000000';
    for (let seg = 1; seg <= totalSegments; seg++) {
      const a = glyphSegmentMidAngle(seg, step, offset);
      gctx.beginPath();
      gctx.arc(GLYPH_CENTER + GLYPH_RADIUS * Math.cos(a), GLYPH_CENTER + GLYPH_RADIUS * Math.sin(a), GLYPH_DOT_RADIUS, 0, Math.PI * 2);
      gctx.fill();
    }

    const groups = {};
    rawList.forEach(v => { (groups[v.seg] = groups[v.seg] || []).push(v); });

    const vertexList = Object.entries(groups).map(([segKey, group]) => {
      const sorted = [...group].sort((a, b) => glyphSlotOrderKey(a.slot) - glyphSlotOrderKey(b.slot));
      if (segKey === 'center') {
        return { kind: 'center', x: GLYPH_CENTER, y: GLYPH_CENTER, entries: sorted };
      }
      if (segKey === 'null') {
        return { kind: 'collapsed', x: GLYPH_CENTER, y: GLYPH_CENTER, entries: sorted };
      }
      const seg = Number(segKey);
      const a = glyphSegmentMidAngle(seg, step, offset);
      return {
        kind: 'segment', seg, entries: sorted,
        x: GLYPH_CENTER + GLYPH_RADIUS * Math.cos(a),
        y: GLYPH_CENTER + GLYPH_RADIUS * Math.sin(a),
      };
    });

    // Crossed-arms treatment (per notation-to-glyph-crossed-test.html):
    // when a hand is crossed, the connector becomes a black/color/black
    // "channel" stroke — inner color is the crossed hand's own color — and
    // a triangle loses its solid fill (stroke-only). Underline stays as-is.
    const isCrossed = crossingHand !== null;
    const crossedColor = isCrossed ? GLYPH_SLOT_COLORS[crossingHand] : null;
    function strokeConnector() {
      if (isCrossed) {
        const blackW = GLYPH_CONNECTOR_LINE_WIDTH + 6;
        const innerW = Math.max(1, blackW - 5);
        gctx.strokeStyle = '#000000';
        gctx.lineWidth = blackW;
        gctx.stroke();
        gctx.strokeStyle = crossedColor;
        gctx.lineWidth = innerW;
        gctx.stroke();
      } else {
        gctx.strokeStyle = '#000000';
        gctx.lineWidth = GLYPH_CONNECTOR_LINE_WIDTH;
        gctx.stroke();
      }
    }

    if (vertexList.length === 2) {
      gctx.beginPath();
      gctx.moveTo(vertexList[0].x, vertexList[0].y);
      gctx.lineTo(vertexList[1].x, vertexList[1].y);
      strokeConnector();
    } else if (vertexList.length === 3) {
      const centerV = vertexList.find(v => v.kind === 'center');
      const edgeVs = vertexList.filter(v => v.kind === 'segment');
      const isCollinear = centerV && edgeVs.length === 2 &&
        Math.abs(edgeVs[0].seg - edgeVs[1].seg) === totalSegments / 2;
      if (isCollinear) {
        gctx.beginPath();
        gctx.moveTo(edgeVs[0].x, edgeVs[0].y);
        gctx.lineTo(edgeVs[1].x, edgeVs[1].y);
        strokeConnector();
      } else {
        gctx.beginPath();
        gctx.moveTo(vertexList[0].x, vertexList[0].y);
        gctx.lineTo(vertexList[1].x, vertexList[1].y);
        gctx.lineTo(vertexList[2].x, vertexList[2].y);
        gctx.closePath();
        if (!isCrossed) {
          gctx.fillStyle = '#000000';
          gctx.fill();
        }
        strokeConnector();
      }
    }

    const LABEL_MARGIN = GLYPH_LABEL_FONT_SIZE * GLYPH_LABEL_MARGIN_RATIO;
    vertexList.forEach(v => {
      let lx = v.x, ly = v.y;
      if (v.kind === 'segment') {
        const a = glyphSegmentMidAngle(v.seg, step, offset);
        lx = GLYPH_CENTER + (GLYPH_RADIUS + LABEL_MARGIN) * Math.cos(a);
        ly = GLYPH_CENTER + (GLYPH_RADIUS + LABEL_MARGIN) * Math.sin(a);
      }
      glyphDrawFramedLabel(gctx, lx, ly, v.entries);
    });
  }

  // ---- Notation parser (ported, unchanged) ----
  function glyphSplitTopLevel(str) {
    let depth = 0, parts = [], current = '';
    for (const ch of str) {
      if (ch === '{') depth++;
      if (ch === '}') depth--;
      if (ch === ',' && depth === 0) { parts.push(current); current = ''; }
      else current += ch;
    }
    parts.push(current);
    return parts;
  }
  function glyphToSeg(tok, maxSeg) {
    if (tok === 'c') return 'center';
    const seg = parseInt(tok, 10);
    if (!(seg >= 1 && seg <= maxSeg)) throw new Error(`Segment out of range in "${tok}"`);
    return seg;
  }
  function glyphParseAirSlot(part, maxSeg) {
    part = part.trim();
    if (part === '0') return [];
    if (part === '#') return [{ seg: null, count: 3 }];
    let m = part.match(/^\{(c|\d+),(c|\d+),(c|\d+)\}$/);
    if (m) {
      const segs = [m[1], m[2], m[3]].map(t => glyphToSeg(t, maxSeg));
      if (segs[0] === segs[1] && segs[1] === segs[2]) throw new Error(`{${segs.join(',')}} — all 3 at one spot; use # instead`);
      const uniqueSegs = [];
      segs.forEach(s => { if (!uniqueSegs.includes(s)) uniqueSegs.push(s); });
      return uniqueSegs.map(seg => ({ seg, count: segs.filter(s => s === seg).length }));
    }
    m = part.match(/^\{(c|\d+),(c|\d+)\}$/);
    if (m) {
      const a = glyphToSeg(m[1], maxSeg), b = glyphToSeg(m[2], maxSeg);
      return a === b ? [{ seg: a, count: 2 }] : [{ seg: a, count: 1 }, { seg: b, count: 1 }];
    }
    m = part.match(/^(c|\d+)(\u00b2)?$/);
    if (m) return [{ seg: glyphToSeg(m[1], maxSeg), count: m[2] ? 2 : 1 }];
    throw new Error(`Invalid A slot: "${part}"`);
  }
  function glyphParseHandSlot(part, maxSeg) {
    part = part.trim();
    if (part === '0') return { point: null, count: 1, crossed: false };
    let m = part.match(/^(\^)?#$/);
    if (m) return { point: { seg: null }, count: 3, crossed: !!m[1] };
    m = part.match(/^(\^)?(c|\d+)(\u00b2)?$/);
    if (!m) throw new Error(`Invalid hand slot: "${part}"`);
    return { point: { seg: glyphToSeg(m[2], maxSeg) }, count: m[3] ? 2 : 1, crossed: !!m[1] };
  }
  function glyphParseNotation(str, segments, segmentAtTop) {
    str = str.trim();
    const m = str.match(/^\[(.*)\]$/);
    if (!m) throw new Error('Must be wrapped in [ ]');
    const parts = glyphSplitTopLevel(m[1]);
    if (parts.length !== 3) throw new Error('Must have exactly 3 comma-separated slots');
    const airEntries = glyphParseAirSlot(parts[0], segments);
    const r = glyphParseHandSlot(parts[1], segments);
    const l = glyphParseHandSlot(parts[2], segments);
    if (r.crossed && l.crossed) throw new Error('R and L cannot both be crossed');
    const airCount = airEntries.reduce((sum, e) => sum + e.count, 0);
    const total = airCount + (r.point ? r.count : 0) + (l.point ? l.count : 0);
    if (total !== 3) throw new Error(`Total balls must be 3 (got ${total})`);
    const segCounts = {};
    airEntries.forEach(e => { if (e.seg !== null) segCounts[e.seg] = (segCounts[e.seg] || 0) + e.count; });
    if (r.point && r.point.seg !== null) segCounts[r.point.seg] = (segCounts[r.point.seg] || 0) + r.count;
    if (l.point && l.point.seg !== null) segCounts[l.point.seg] = (segCounts[l.point.seg] || 0) + l.count;
    Object.values(segCounts).forEach(count => {
      if (count === 3) throw new Error('All 3 balls cannot occupy one location — use # instead');
    });
    const labels = { A: airEntries, R: r.point, L: l.point };
    const ballCounts = { A: 1, R: r.count, L: l.count };
    const crossingHand = r.crossed ? 'R' : (l.crossed ? 'L' : null);
    const step = (Math.PI * 2) / segments;
    // The glyph's segmentMidAngle uses +(seg-0.5)*step (juggler's-clockwise
    // convention, mirror of the map's own -(seg-0.5)*step), so it needs the
    // opposite-signed offset from the map to land segment 1 at 12 o'clock
    // instead of 2 o'clock. Toggle-off (0) is unaffected either way.
    const offset = segmentAtTop ? -step / 2 : 0;
    return { labels, ballCounts, crossingHand, step, offset };
  }

  const glyphOffscreenCanvas = document.createElement('canvas');
  glyphOffscreenCanvas.width = GLYPH_SIZE;
  glyphOffscreenCanvas.height = GLYPH_SIZE;
  const glyphOffscreenCtx = glyphOffscreenCanvas.getContext('2d');

  // Renders a notation string to a PNG data URL, using the ported official
  // renderer end-to-end (parse -> draw), for exact visual parity.
  function renderGlyphDataUrl(notation) {
    const parsed = glyphParseNotation(notation, SEGMENTS, SEGMENT_AT_TOP);
    glyphDrawEntry(glyphOffscreenCtx, parsed);
    return glyphOffscreenCanvas.toDataURL('image/png');
  }

  // Keyed to match the sequence-tester's SLIDER_DEFS naming, so the two
  // stay conceptually aligned even though this module's variables are
  // named differently (GLYPH_* prefix, no per-slider metadata object).
  function glyphSetConst(key, value) {
    switch (key) {
      case 'canvasPadding': GLYPH_CANVAS_PADDING = value; break;
      case 'dotRadius': GLYPH_DOT_RADIUS = value; break;
      case 'labelFontSize': GLYPH_LABEL_FONT_SIZE = value; break;
      case 'labelPaddingExtra': GLYPH_LABEL_PADDING_EXTRA = value; break;
      case 'labelCornerRadius': GLYPH_LABEL_CORNER_RADIUS = value; break;
      case 'frameBorderWidth': GLYPH_FRAME_BORDER_WIDTH = value; break;
      case 'circleLineWidth': GLYPH_CIRCLE_LINE_WIDTH = value; break;
      case 'connectorLineWidth': GLYPH_CONNECTOR_LINE_WIDTH = value; break;
      case 'glyphRadius': GLYPH_RADIUS = value; break;
    }
  }

  return {
    drawEntry: glyphDrawEntry,
