    parseNotation: glyphParseNotation,
    renderDataUrl: renderGlyphDataUrl,
    setConst: glyphSetConst,
  };
  })();

  // ==================== Export ====================
  const MAP_SLOT_COLORS = { A: '#c0392b', R: '#e67e22', L: '#2874a6' };
  const EXPORT_SIZE = 1080; // px, square

  // "[3,^4,6]" -> "3_^4_6"; "[{3,6},4,2]" -> "3-6_4_2" — ported from
  // composite-mapper-30.html's safeName, same bracket/brace/comma handling.
  function safeName(notation) {
    return notation
      .replace(/[\[\]]/g, '')
      .replace(/\{([^}]*)\}/g, (_, inner) => inner.split(',').join('-'))
      .split(',')
      .join('_');
  }

  // Fresh canvas-native renderer for export — reuses the same geometry math
  // (computeGeometryForImage/classifySegment) the live DOM/SVG map uses, but
  // draws with canvas primitives so it can be baked into a real image file.
  // Deliberately leaves out the segment-number badges (a testing aid, not
  // part of the intended deliverable).
  function drawMapGeometryToCanvas(exportCtx, imgId, size) {
    const geometry = computeGeometryForImage(imgId);
    const pts = pointsByImage[imgId];
    if (!geometry || !pts) return;

    const cx = geometry.cx * size, cy = geometry.cy * size, maxDist = geometry.maxDist * size;

    exportCtx.beginPath();
    exportCtx.arc(cx, cy, maxDist, 0, Math.PI * 2);
    exportCtx.strokeStyle = '#0040ff';
    exportCtx.lineWidth = size * 0.0018;
    exportCtx.stroke();

    for (let i = 0; i < SEGMENTS; i++) {
      const angle = -Math.PI / 2 + geometry.offset + i * geometry.step;
      exportCtx.beginPath();
      exportCtx.moveTo(cx, cy);
      exportCtx.lineTo(cx + maxDist * Math.cos(angle), cy + maxDist * Math.sin(angle));
      exportCtx.strokeStyle = '#ff9900';
      exportCtx.lineWidth = size * 0.0013;
      exportCtx.globalAlpha = 0.85;
      exportCtx.stroke();
      exportCtx.globalAlpha = 1;
    }

    exportCtx.beginPath();
    exportCtx.arc(cx, cy, maxDist * CENTER_ZONE_FRACTION, 0, Math.PI * 2);
    exportCtx.setLineDash([size * 0.003, size * 0.002]);
    exportCtx.strokeStyle = '#aa00aa';
    exportCtx.lineWidth = size * 0.0013;
    exportCtx.stroke();
    exportCtx.setLineDash([]);

    exportCtx.beginPath();
    exportCtx.arc(cx, cy, size * 0.0018, 0, Math.PI * 2);
    exportCtx.fillStyle = '#ff0000';
    exportCtx.fill();
    exportCtx.lineWidth = size * 0.001;
    exportCtx.strokeStyle = '#fff';
    exportCtx.stroke();

    const locations = [];
    ['A', 'R', 'L'].forEach(s => pts[s].forEach(p => locations.push(p)));
    if (locations.length >= 2) {
      // Matches buildConnector exactly (Reply 206/208) — plain two-tone
      // outline, white halo then black line, never filled, no crossed-color
      // distinction. The export used to fill black + color crossed edges,
      // which was never what the live canvas actually shows.
      [{ stroke: '#fff', width: size * 0.0055 }, { stroke: '#000', width: size * 0.0023 }].forEach(cfg => {
        exportCtx.beginPath();
        exportCtx.moveTo(locations[0].x * size, locations[0].y * size);
        for (let i = 1; i < locations.length; i++) exportCtx.lineTo(locations[i].x * size, locations[i].y * size);
        exportCtx.closePath();
        exportCtx.strokeStyle = cfg.stroke;
        exportCtx.lineWidth = cfg.width;
        exportCtx.lineJoin = 'round';
        exportCtx.stroke();
      });
    }

    // Ghost cloud (Reply 206/208) — was missing entirely from export.
    // Same colors as MAP_SLOT_COLORS (identical to the live .ghostDot
    // CSS's per-slot colors already), drawn before the real markers so it
    // sits underneath, same layering as the live DOM (ghostLayer inserted
    // before pointsOverlay).
    const ghost = ghostPointsByImage[imgId];
    if (ghost) {
      const ghostR = size * 0.0042;
      exportCtx.globalAlpha = 0.55;
      ['A', 'R', 'L'].forEach(slot => {
        ghost[slot].forEach(pt => {
          exportCtx.beginPath();
          exportCtx.arc(pt.x * size, pt.y * size, ghostR, 0, Math.PI * 2);
          exportCtx.fillStyle = MAP_SLOT_COLORS[slot];
          exportCtx.fill();
          exportCtx.lineWidth = size * 0.0005;
          exportCtx.strokeStyle = '#fff';
          exportCtx.stroke();
        });
      });
      exportCtx.globalAlpha = 1;
    }

    ['A', 'R', 'L'].forEach(slot => {
      pts[slot].forEach(p => {
        const mx = p.x * size, my = p.y * size;
        const count = p.count || 1;
        const baseR = size * 0.0148;
        for (let i = 1; i < count; i++) {
          const rr = baseR + i * (size * 0.0093);
          exportCtx.beginPath();
          if (p.crossed) exportCtx.rect(mx - rr, my - rr, rr * 2, rr * 2);
          else exportCtx.arc(mx, my, rr, 0, Math.PI * 2);
          exportCtx.strokeStyle = MAP_SLOT_COLORS[slot];
          exportCtx.lineWidth = size * 0.0018;
          exportCtx.stroke();
        }
        exportCtx.beginPath();
        if (p.crossed) {
          const s = baseR * 1.6;
          exportCtx.rect(mx - s / 2, my - s / 2, s, s);
        } else {
          exportCtx.arc(mx, my, baseR, 0, Math.PI * 2);
        }
        exportCtx.fillStyle = MAP_SLOT_COLORS[slot];
        exportCtx.fill();
        exportCtx.lineWidth = size * 0.0022;
        exportCtx.strokeStyle = '#fff';
        exportCtx.stroke();
        exportCtx.fillStyle = '#fff';
        exportCtx.font = `bold ${size * (count > 1 ? 0.013 : 0.017)}px sans-serif`;
        exportCtx.textAlign = 'center';
        exportCtx.textBaseline = 'middle';
        exportCtx.fillText(slot.repeat(count), mx, my);

        // Segment badge (Reply 206/208) — matches buildSegBadge/.segBadge:
        // small white rounded label, centered under the marker, offset down.
        if (p.seg != null) {
          const label = p.seg === 'center' ? 'c' : String(p.seg);
          const badgeFont = size * 0.0083;
          const badgeY = my + baseR * 1.5;
          exportCtx.font = `600 ${badgeFont}px sans-serif`;
          const textW = exportCtx.measureText(label).width;
          const padX = size * 0.0037, padY = size * 0.0028;
          const boxW = textW + padX * 2, boxH = badgeFont + padY * 2;
          exportCtx.fillStyle = '#ffffff';
          exportCtx.strokeStyle = 'rgba(0,0,0,0.15)';
          exportCtx.lineWidth = size * 0.0009;
          exportCtx.beginPath();
          exportCtx.roundRect(mx - boxW / 2, badgeY, boxW, boxH, size * 0.0028);
          exportCtx.fill();
          exportCtx.stroke();
          exportCtx.fillStyle = '#444444';
          exportCtx.textAlign = 'center';
          exportCtx.textBaseline = 'middle';
          exportCtx.fillText(label, mx, badgeY + boxH / 2);
        }
      });
    });
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));
  }
  function dataUrlToBlob(dataUrl) {
    const [meta, b64] = dataUrl.split(',');
    const mime = meta.match(/:(.*?);/)[1];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function loadImageFromSrc(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // ==================== Pattern glyph sequence PNG ====================
  // Ported from glyph-sequence-tester.html (Reply 189-193) — same arrow
  // math, oversampling, and both layouts, pointed at real locked-image
  // data instead of test notations. No sliders here (Reply 190): every
  // composite number below is fixed at the tester's finalized defaults
  // (Reply 187/188). Both horizontal and vertical variants are always
  // exported (Reply 203/204) — no toggle, no branch.
  const SEQUENCE_DEFAULTS = {
    cellSize: 240, gapX: 50, gapY: 46, margin: 18, titleFontSize: 44,
    arrowLineWidth: 12, arrowPullbackPct: 33, arrowTipGap: 0,
    labelGap: 4, notationLabelSize: 30, titleGap: 16, compositeGlyphPadding: 36,
  };

  function drawSequenceArrow(ctx, x1, y1, x2, y2, tipGap) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = ctx.lineWidth * 3;
    const shaftEndX = x2 - (headLen * Math.cos(Math.PI / 6) + tipGap) * Math.cos(angle);
    const shaftEndY = y2 - (headLen * Math.cos(Math.PI / 6) + tipGap) * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(shaftEndX, shaftEndY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
  }

  // Renders every locked image's glyph at OVERSAMPLE× the current live
  // glyph-rendering settings (Reply 193 — respects whatever's tuned in
  // this app's own settings panel, unlike the composite layout numbers
  // above which are fixed), same supersampling reasoning as the tester.
  async function loadOversampledSequenceEntries(lockedRecs) {
    const OVERSAMPLE = 3;
    const savedValues = { ...currentGlyphConstValues };
    Object.keys(currentGlyphConstValues).forEach(key => {
      const base = key === 'canvasPadding' ? SEQUENCE_DEFAULTS.compositeGlyphPadding : currentGlyphConstValues[key];
      Glyph.setConst(key, Math.round(base * OVERSAMPLE));
    });
    const entries = lockedRecs.map(rec => ({ notation: rec.notation, src: Glyph.renderDataUrl(rec.notation) }));
    Object.keys(savedValues).forEach(key => { Glyph.setConst(key, savedValues[key]); });
    const seqImages = await Promise.all(entries.map(e => loadImageFromSrc(e.src)));
    return { entries, seqImages };
  }

  // No "invalid" placeholder branch here (unlike the tester) — a locked
  // image's notation can't be invalid by construction, so that dead path
  // from the tester is simply omitted rather than ported unnecessarily.
  function drawSequenceCells(ctx, entries, seqImages, cellPos, CELL) {
    entries.forEach((e, i) => {
      const { x, y } = cellPos[i];
      ctx.drawImage(seqImages[i], x, y, CELL, CELL);
      ctx.fillStyle = '#1c2226';
      ctx.font = `600 ${SEQUENCE_DEFAULTS.notationLabelSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(e.notation, x + CELL / 2, y + CELL + SEQUENCE_DEFAULTS.labelGap);
    });

    ctx.strokeStyle = '#2a7de1';
    ctx.fillStyle = '#2a7de1';
    ctx.lineWidth = SEQUENCE_DEFAULTS.arrowLineWidth;
    const PULLBACK = CELL * (SEQUENCE_DEFAULTS.arrowPullbackPct / 100) + 5;
    for (let i = 0; i < entries.length - 1; i++) {
      const c1 = { x: cellPos[i].x + CELL / 2, y: cellPos[i].y + CELL / 2 };
      const c2 = { x: cellPos[i + 1].x + CELL / 2, y: cellPos[i + 1].y + CELL / 2 };
      const dx = c2.x - c1.x, dy = c2.y - c1.y;
      const dist = Math.hypot(dx, dy);
      const ux = dx / dist, uy = dy / dist;
      drawSequenceArrow(ctx, c1.x + ux * PULLBACK, c1.y + uy * PULLBACK, c2.x - ux * PULLBACK, c2.y - uy * PULLBACK, SEQUENCE_DEFAULTS.arrowTipGap);
    }
  }

  function buildSequenceGridCanvas(entries, seqImages, title) {
    const COLS = 2;
    const CELL = SEQUENCE_DEFAULTS.cellSize, LABEL_H = 24;
    const GAP_X = SEQUENCE_DEFAULTS.gapX, GAP_Y = SEQUENCE_DEFAULTS.gapY;
    const MARGIN = SEQUENCE_DEFAULTS.margin, TITLE_H = SEQUENCE_DEFAULTS.titleFontSize + SEQUENCE_DEFAULTS.titleGap;
    const rows = Math.ceil(entries.length / COLS);
    const canvasW = MARGIN * 2 + COLS * CELL + (COLS - 1) * GAP_X;
    const canvasH = MARGIN + TITLE_H + rows * (CELL + LABEL_H) + Math.max(0, rows - 1) * GAP_Y + MARGIN;

    const canvas = document.createElement('canvas');
    canvas.width = canvasW;
    canvas.height = canvasH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasW, canvasH);

    if (title) {
      ctx.fillStyle = '#1c2226';
      ctx.font = `bold ${SEQUENCE_DEFAULTS.titleFontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(title, canvasW / 2, MARGIN / 2 + TITLE_H / 2);
    }

    const cellPos = entries.map((_, i) => {
      const row = Math.floor(i / COLS), col = i % COLS;
      return { x: MARGIN + col * (CELL + GAP_X), y: MARGIN + TITLE_H + row * (CELL + LABEL_H + GAP_Y) };
    });
    drawSequenceCells(ctx, entries, seqImages, cellPos, CELL);
    return canvas;
  }

  function buildSequenceHorizontalCanvas(entries, seqImages, title) {
    const CELL = SEQUENCE_DEFAULTS.cellSize, LABEL_H = 24;
    const GAP_X = SEQUENCE_DEFAULTS.gapX;
    const MARGIN = SEQUENCE_DEFAULTS.margin;
    const rowH = CELL + LABEL_H + SEQUENCE_DEFAULTS.labelGap;

    const measureCtx = document.createElement('canvas').getContext('2d');
    measureCtx.font = `bold ${SEQUENCE_DEFAULTS.titleFontSize}px sans-serif`;
    const titleW = title ? measureCtx.measureText(title).width : 0;
    const titleBlockW = title ? titleW + MARGIN : 0;

    const canvasW = MARGIN + titleBlockW + entries.length * CELL + Math.max(0, entries.length - 1) * GAP_X + MARGIN;
    const canvasH = MARGIN * 2 + rowH;

    const canvas = document.createElement('canvas');
    canvas.width = canvasW;
    canvas.height = canvasH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasW, canvasH);

    if (title) {
      ctx.fillStyle = '#1c2226';
      ctx.font = `bold ${SEQUENCE_DEFAULTS.titleFontSize}px sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(title, MARGIN, canvasH / 2);
    }

    const rowStartX = MARGIN + titleBlockW;
    const cellPos = entries.map((_, i) => ({ x: rowStartX + i * (CELL + GAP_X), y: MARGIN }));
    drawSequenceCells(ctx, entries, seqImages, cellPos, CELL);
    return canvas;
  }

  // Returns {horizontal, vertical}, both null if there's nothing to render
  // (Reply 190 Q1 — no separate confirmation needed, just skip the files).
  // Reply 203: both variants always generated now, no toggle to branch on.
  async function buildPatternSequenceCanvases(title) {
    const lockedRecs = images.filter(r => r.locked);
    if (lockedRecs.length === 0) return { horizontal: null, vertical: null };
    const { entries, seqImages } = await loadOversampledSequenceEntries(lockedRecs);
    return {
      horizontal: buildSequenceHorizontalCanvas(entries, seqImages, title),
      vertical: buildSequenceGridCanvas(entries, seqImages, title),
    };
  }

  exportBtn.addEventListener('click', async () => {
    const committed = images.filter(r => r.locked);
    if (committed.length === 0) {
      showToast('No committed positions to export yet');
      return;
    }
    // Reply 190: pre-filled with the pattern-name field's current value;
    // Cancel still aborts (null), but OK-with-empty now falls back to
    // "juggling pattern" instead of aborting — a real behavior change
    // from before, where empty and Cancel were treated identically.
    let patternName = prompt('Pattern name for this export:', patternNameInput.value.trim());
    if (patternName === null) return; // Cancel
    if (patternName.trim() === '') patternName = 'juggling pattern';

    exportBtn.disabled = true;
    try {
      const zip = new JSZip();
      const root = zip.folder(patternName);
      let posNum = 0;
      const csvFields = [patternName];
      for (const rec of images) {
        if (!rec.locked) continue; // skip pending, per confirmed scope
        posNum++;
        csvFields.push(rec.notation);
        const folder = root.folder(`${posNum}_(${safeName(rec.notation)})`);
        const prefix = `pos${posNum}_`;

        folder.file(`${prefix}photo.jpg`, dataUrlToBlob(rec.src));
        folder.file(`${prefix}notation_bracket.txt`, rec.notation);
        folder.file(`${prefix}position_glyph.png`, dataUrlToBlob(rec.glyphSrc));

        const mapCanvas = document.createElement('canvas');
        mapCanvas.width = mapCanvas.height = EXPORT_SIZE;
        drawMapGeometryToCanvas(mapCanvas.getContext('2d'), rec.id, EXPORT_SIZE);
        folder.file(`${prefix}map.png`, await canvasToBlob(mapCanvas, 'image/png'));

        const compCanvas = document.createElement('canvas');
        compCanvas.width = compCanvas.height = EXPORT_SIZE;
        const compCtx = compCanvas.getContext('2d');
        const photoImg = await loadImageFromSrc(rec.src);
        compCtx.drawImage(photoImg, 0, 0, EXPORT_SIZE, EXPORT_SIZE);
        drawMapGeometryToCanvas(compCtx, rec.id, EXPORT_SIZE);
        folder.file(`${prefix}position_composite.jpg`, await canvasToBlob(compCanvas, 'image/jpeg', 0.9));
      }

      // notation strings contain commas ("[3,^4,6]"), so every field is
      // quoted (with internal quotes doubled), not just comma-containing ones
      const csvLine = csvFields.map(f => `"${String(f).replace(/"/g, '""')}"`).join(',');
      root.file(`${patternName}.csv`, csvLine);

      const seqCanvases = await buildPatternSequenceCanvases(patternName);
      if (seqCanvases.horizontal) {
        root.file(`${patternName}_sequence_horizontal.png`, await canvasToBlob(seqCanvases.horizontal, 'image/png'));
      }
      if (seqCanvases.vertical) {
        root.file(`${patternName}_sequence_vertical.png`, await canvasToBlob(seqCanvases.vertical, 'image/png'));
      }


      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${safeName(patternName).replace(/[^a-z0-9_\-]/gi, '_') || 'pattern'}.zip`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      showToast('Export failed: ' + err.message);
    } finally {
      exportBtn.disabled = false;
    }
  });

  // ==================== Glyph bar (real, one slot per image) ====================
  function renderGlyphBar() {
    glyphBarEl.innerHTML = '';
    images.forEach((rec, i) => {
      const slotEl = document.createElement('div');
      slotEl.className = 'glyphSlot' + (rec.locked ? ' committed' : '');
      slotEl.dataset.imgId = rec.id;

      const badge = document.createElement('div');
      badge.className = 'posBadge';
      badge.textContent = i + 1;
      slotEl.appendChild(badge);

      if (rec.locked) {
        const img = document.createElement('img');
        img.className = 'glyphImg';
        img.src = rec.glyphSrc;
        const label = document.createElement('div');
        label.className = 'notationLabel';
        label.textContent = rec.notation;
        slotEl.appendChild(img);
        slotEl.appendChild(label);
      } else {
        const pendingText = document.createElement('div');
        pendingText.textContent = 'pending';
        slotEl.appendChild(pendingText);
      }
      wireGlyphSlotGestures(slotEl, rec.id);
      glyphBarEl.appendChild(slotEl);
    });
  }

  // Long-press (~500ms, no movement) on a glyph-bar slot starts reordering;
  // a clean tap navigates (existing behavior); movement before the long-press
  // fires is treated as a manual bar-scroll instead, since the slot itself
  // is touch-action:none (see CSS) — native scroll can't start on it directly,
  // so this replicates it in JS rather than losing scroll-by-swiping-a-glyph.
  const REORDER_LONG_PRESS_MS = 500;
  let glyphAutoScrollTimer = null;

  function wireGlyphSlotGestures(slotEl, imgId) {
    let mode = null; // 'scroll' | 'reorder'
    let startX = null, startY = null, moved = false;
    let startScrollLeft = 0;
    let longPressTimer = null;
    let dragStartLeft = 0; // slotEl's offsetLeft at drag start, for the transform

    slotEl.addEventListener('pointerdown', e => {
      startX = e.clientX; startY = e.clientY; moved = false; mode = null;
      startScrollLeft = glyphBarEl.scrollLeft;
      slotEl.setPointerCapture(e.pointerId);
      longPressTimer = setTimeout(() => {
        mode = 'reorder';
        slotEl.classList.add('dragging');
        dragStartLeft = slotEl.offsetLeft;
      }, REORDER_LONG_PRESS_MS);
    });

    slotEl.addEventListener('pointermove', e => {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 8) {
        moved = true;
        if (mode !== 'reorder') {
          clearTimeout(longPressTimer);
          mode = 'scroll';
        }
      }
      if (mode === 'scroll') {
        glyphBarEl.scrollLeft = startScrollLeft - dx;
      } else if (mode === 'reorder') {
        slotEl.style.transform = `translateX(${dx}px)`;
        slotEl.style.zIndex = '5';

        // auto-scroll near either edge of the bar
        const barRect = glyphBarEl.getBoundingClientRect();
        const EDGE = 40;
        clearInterval(glyphAutoScrollTimer);
        if (e.clientX - barRect.left < EDGE) {
          glyphAutoScrollTimer = setInterval(() => { glyphBarEl.scrollLeft -= 8; }, 16);
        } else if (barRect.right - e.clientX < EDGE) {
          glyphAutoScrollTimer = setInterval(() => { glyphBarEl.scrollLeft += 8; }, 16);
        }

        // find which sibling slot the pointer is currently over and, if past
        // its midpoint, swap it with the dragged slot immediately — reorders
        // images[] live and moves the OTHER dom node (not the dragged one,
        // which stays under transform control), so no element holding
        // pointer capture ever gets recreated mid-gesture
        const dragIdx = images.findIndex(r => r.id === imgId);
        const siblings = Array.from(glyphBarEl.children);
        for (const sib of siblings) {
          if (sib === slotEl) continue;
          const r = sib.getBoundingClientRect();
          const mid = r.left + r.width / 2;
          const sibIdx = images.findIndex(rec => rec.id === sib.dataset.imgId);
          if (dragIdx < sibIdx && e.clientX > mid) {
            images.splice(sibIdx, 0, images.splice(dragIdx, 1)[0]);
            glyphBarEl.insertBefore(sib, slotEl);
            renumberGlyphBadges();
            break;
          } else if (dragIdx > sibIdx && e.clientX < mid) {
            images.splice(sibIdx, 0, images.splice(dragIdx, 1)[0]);
            glyphBarEl.insertBefore(slotEl, sib);
            renumberGlyphBadges();
            break;
          }
        }
      }
    });

    function endGesture(e) {
      clearTimeout(longPressTimer);
      clearInterval(glyphAutoScrollTimer);
      if (mode === 'reorder') {
        slotEl.classList.remove('dragging');
        slotEl.style.transform = '';
        slotEl.style.zIndex = '';
        activeIndex = images.findIndex(r => r.id === imgId);
        renderMainCanvas();
      } else if (mode === null && !moved) {
        // clean tap — navigate
        activeIndex = images.findIndex(r => r.id === imgId);
        positionTrack(true);
        renderDots();
      }
      mode = null;
    }
    slotEl.addEventListener('pointerup', endGesture);
    slotEl.addEventListener('pointercancel', endGesture);
  }

  function renumberGlyphBadges() {
    Array.from(glyphBarEl.children).forEach((slotEl, i) => {
      const badge = slotEl.querySelector('.posBadge');
      if (badge) badge.textContent = i + 1;
    });
  }

  function tryStack(imgId, slot, idx) {
    const p = pointsByImage[imgId] && pointsByImage[imgId][slot][idx];
    if (!p) return;
    if ((p.count || 1) >= 3) {
      showToast('This slot is full');
      return;
    }
    if (getTotalBallCount(imgId) >= BALL_BUDGET) {
      showToast('All 3 balls are already placed');
      return;
    }
    p.count = (p.count || 1) + 1;
    renderMainCanvas();
  }

  // ---- crossing hand (step 13) ----
  // R/L only — A can never be crossed, per the grammar. Only one of R/L
  // can be crossed at a time (auto-exclusive).
  const LONG_PRESS_MS = 500;

  function toggleCrossedData(imgId, slot) {
    const pts = pointsByImage[imgId];
    if (!pts) return;
    const p = pts[slot][0];
    if (!p) return;
    if (p.crossed) {
      p.crossed = false;
    } else {
      p.crossed = true;
      const other = slot === 'R' ? 'L' : 'R';
      if (pts[other][0]) pts[other][0].crossed = false;
    }
  }

  // Concentric stack rings — one per extra ball beyond the first, drawn
  // outward from the marker's shared center anchor.
  function buildMarkerRings(wrap, slot, count, crossed) {
    for (let i = 1; i < count; i++) {
      const ring = document.createElement('div');
      ring.className = 'markerRing slot-' + slot + (crossed ? ' crossed' : '');
      const ringSize = 16 + i * 10;
      ring.style.width = ringSize + 'px';
      ring.style.height = ringSize + 'px';
      wrap.appendChild(ring);
    }
  }

  // The actual interactive marker element (letter label, crossed styling).
  // Gesture handlers are wired separately.
  function buildMarkerLabel(slot, p, locked) {
    const count = p.count || 1;
    const m = document.createElement('div');
    m.className = 'pointMarker slot-' + slot + (p.crossed ? ' crossed' : '');
    m.textContent = slot.repeat(count);
    m.style.fontSize = count > 1 ? '6px' : '8px';
    if (locked) m.style.pointerEvents = 'none'; // frozen — no drag/tap/long-press at all
    return m;
  }

  // Segment-number badge, shown once geometry exists (3-ball budget met).
  function buildSegBadge(p) {
    if (p.seg == null) return null;
    const badge = document.createElement('div');
    badge.className = 'segBadge';
    badge.textContent = (p.seg === 'center') ? 'c' : p.seg;
    return badge;
  }

  // All pointer/gesture handling for one marker: drag (active slot only),
  // tap-to-switch-slot (foreign markers), double-tap-to-stack, long-press-
  // to-cross (R/L only), and the instant grab-ring feedback.
  // Every marker intercepts its own gesture via stopPropagation — the wrap's
  // swipe/tap handler must never see a marker-originated pointerdown.
  function wireMarkerGestures(m, wrap, imgId, slot, idx, p) {
    let mode = null;      // 'drag' (active slot) | 'tap-track' (foreign slot)
    let startX = null, startY = null, moved = false;
    let lastTapEnd = 0;
    const DOUBLE_TAP_MS = 300;
    let longPressTimer = null;
    let longPressFired = false;
    let grabRingEl = null;

    m.addEventListener('pointerdown', e => {
      e.stopPropagation();
      startX = e.clientX; startY = e.clientY; moved = false;
      longPressFired = false;
      mode = (slot === activeSlot) ? 'drag' : 'tap-track';
      m.setPointerCapture(e.pointerId);

      // Instant "grabbed" feedback the moment the press starts, and it
      // stays visible for the whole hold, not just a brief animation.
      if (mode === 'drag') {
        grabRingEl = document.createElement('div');
        grabRingEl.className = 'grabRing';
        const size = 16 + GRAB_RING_EXTRA * 2;
        grabRingEl.style.width = size + 'px';
        grabRingEl.style.height = size + 'px';
        wrap.appendChild(grabRingEl);
      }

      // Long-press to toggle crossed, R/L only.
      if (mode === 'drag' && (slot === 'R' || slot === 'L')) {
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          toggleCrossedData(imgId, slot); // data only — no render mid-gesture,
          if (grabRingEl) grabRingEl.style.borderRadius = '4px'; // that would
        }, LONG_PRESS_MS);                                        // drop capture
      }
    });
    m.addEventListener('pointermove', e => {
      if (!mode) return;
      e.stopPropagation();
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
        moved = true;
        clearTimeout(longPressTimer); // real movement cancels the long-press
      }
      // only actually reposition once real movement is confirmed — otherwise
      // ordinary hand tremor while holding still was nudging the point,
      // which made a clean long-press very hard to land
      if (mode === 'drag' && moved && !longPressFired) {
        const rect = mainCanvasWrap.getBoundingClientRect();
        const fx = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        const fy = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        wrap.style.left = (fx * 100) + '%';
        wrap.style.top = (fy * 100) + '%';
        if (pointsByImage[imgId] && pointsByImage[imgId][slot][idx]) {
          pointsByImage[imgId][slot][idx].x = fx;
          pointsByImage[imgId][slot][idx].y = fy;
        }
        refreshOverlaysForActiveSlide();
      }
      // tap-track mode: just watching for movement, marker doesn't move
    });
    function endGesture(e) {
      clearTimeout(longPressTimer);
      if (grabRingEl) { grabRingEl.remove(); grabRingEl = null; }
      if (longPressFired) {
        // the long-press already handled this gesture — now safe to
        // re-render, since the finger has lifted and capture is released
        renderMainCanvas();
      } else if (mode === 'tap-track' && !moved) {
        // clean tap on a foreign marker — switch to its slot (a separate
        // touch is then needed to drag it; see reply 80/82)
        setActiveSlot(slot);
      } else if (mode === 'drag' && !moved) {
        // clean tap (no drag) on the active slot's own marker — check for a
        // double-tap to stack it
        const now = Date.now();
        if (now - lastTapEnd < DOUBLE_TAP_MS) {
          tryStack(imgId, slot, idx);
          lastTapEnd = 0;
        } else {
          lastTapEnd = now;
        }
      } else if (mode === 'drag' && moved) {
        // a real drag finished — re-render so segment classification/badges
        // reflect the point's new position (they aren't updated live during
        // the drag itself, only the visual position is)
        renderMainCanvas();
      }
      mode = null;
    }
    m.addEventListener('pointerup', endGesture);
    m.addEventListener('pointercancel', endGesture);
  }

  function createPointMarker(imgId, slot, idx, p, locked) {
    const wrap = document.createElement('div');
    wrap.className = 'markerGroup';
    wrap.dataset.slot = slot;
    wrap.dataset.idx = idx;
    wrap.style.left = (p.x * 100) + '%';
    wrap.style.top = (p.y * 100) + '%';

    buildMarkerRings(wrap, slot, p.count || 1, p.crossed);

    const m = buildMarkerLabel(slot, p, locked);
    wireMarkerGestures(m, wrap, imgId, slot, idx, p);
    wrap.appendChild(m);

    const badge = buildSegBadge(p);
    if (badge) wrap.appendChild(badge);
    return wrap;
  }

  (function wireMainSwipe() {
    let startX = null, startY = null, dragging = false, lockedHorizontal = false;
    mainCanvasWrap.addEventListener('pointerdown', e => {
      if (images.length === 0) return;
      startX = e.clientX; startY = e.clientY; dragging = true; lockedHorizontal = false;
      mainCanvasWrap.setPointerCapture(e.pointerId);
    });
    mainCanvasWrap.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!lockedHorizontal && Math.abs(dx) > 8) lockedHorizontal = true;
      if (lockedHorizontal) {
        mainCanvasTrack.style.transition = 'none';
        mainCanvasTrack.style.transform = `translateX(calc(-${activeIndex * 100}% + ${dx}px))`;
      }
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      const dx = e.clientX - startX;
      if (lockedHorizontal) {
        if (dx < -50 && activeIndex < images.length - 1) goToIndex(activeIndex + 1, true);
        else if (dx > 50 && activeIndex > 0) goToIndex(activeIndex - 1, true);
        else positionTrack(true);
      } else {
        // small movement = a tap, not a swipe: place a point
        placePoint(e.clientX, e.clientY);
      }
    }
    mainCanvasWrap.addEventListener('pointerup', endDrag);
    mainCanvasWrap.addEventListener('pointercancel', endDrag);
  })();

  // ---- X: unlock -> remove most-recent point -> confirm+delete image ----
  deleteActiveBtn.addEventListener('click', () => {
    if (images.length === 0) return;
    const rec = images[activeIndex];

    if (rec.locked) {
      // first tap after a commit only unlocks — nothing deleted yet
      rec.locked = false;
      renderMainCanvas();
      return;
    }

    const pts = pointsByImage[rec.id];
    let latestSlot = null, latestIdx = -1, latestSeq = -Infinity;
    if (pts) {
      ['A', 'R', 'L'].forEach(s => {
        pts[s].forEach((p, i) => {
          if ((p.seq || 0) > latestSeq) { latestSeq = p.seq || 0; latestSlot = s; latestIdx = i; }
        });
      });
    }
    if (latestSlot !== null) {
      // points remain — remove the globally most-recent one, silently
      pts[latestSlot].splice(latestIdx, 1);
      renderMainCanvas();
      return;
    }

    if (ghostPointsByImage[rec.id]) {
      // leftover ghost scatter from a past average, no points left to
      // remove first — clear it silently, same tier pattern as the point
      // removal above, before falling through to the final delete-photo tier
      delete ghostPointsByImage[rec.id];
      renderMainCanvas();
      return;
    }

    // no points or ghost cloud left — final tier, confirm before deleting the photo itself
    if (!confirm('Delete this photo? This also removes its points.')) return;
    images.splice(activeIndex, 1);
    if (activeIndex >= images.length) activeIndex = images.length - 1;
    renderMainCanvas();
  });

  // ---- commit position (step 15) ----
  commitBtn.addEventListener('click', () => {
    if (images.length === 0) return;
    const rec = images[activeIndex];
    if (!rec || rec.locked) return;
    const result = assembleNotation(rec.id);
    if (result.error) {
      showToast(result.error);
      return;
    }
    try {
      rec.glyphSrc = Glyph.renderDataUrl(result.notation);
    } catch (err) {
      showToast('Could not render glyph: ' + err.message);
      return;
    }
    rec.notation = result.notation;
    rec.locked = true;
    renderMainCanvas();
  });

  // ---- slot selection ----
  let activeSlot = null; // 'A' | 'R' | 'L' | null

  function setActiveSlot(slot) {
    activeSlot = slot;
    slotBtnEls.forEach(b => b.classList.toggle('active', b.dataset.slot === slot));
    renderMainCanvas();
  }
  slotBtnEls.forEach(b => {
    b.addEventListener('click', () => setActiveSlot(b.dataset.slot));
  });

  // ---- Clear All ----
  clearAllBtn.addEventListener('click', () => {
    if (images.length === 0) return;
    if (!confirm('Remove all photos?')) return;
    images = [];
    activeIndex = 0;
    renderMainCanvas();
  });

  segTopCheckbox.addEventListener('change', () => {
    const proceed = confirm(
      'Switching segment orientation clears all placed points and committed ' +
      'positions on every photo. Photos themselves are kept. Continue?'
    );
    if (!proceed) {
      segTopCheckbox.checked = SEGMENT_AT_TOP; // revert the visual toggle
      return;
    }
    SEGMENT_AT_TOP = segTopCheckbox.checked;
    pointsByImage = {};
    images.forEach(rec => {
      rec.locked = false;
      rec.notation = null;
      rec.glyphSrc = null;
    });
    activeSlot = null;
    slotBtnEls.forEach(b => b.classList.remove('active'));
    renderMainCanvas();
  });

  // ==================== Settings panel ====================
  let autoAdvanceEnabled = true;
  autoAdvanceCheckbox.addEventListener('change', () => {
    autoAdvanceEnabled = autoAdvanceCheckbox.checked;
  });

  settingsBtn.addEventListener('click', () => {
    cropView.classList.remove('active');
    settingsView.classList.add('active');
    modalOverlay.classList.add('open');
  });

  settingsClose.addEventListener('click', () => {
    modalOverlay.classList.remove('open');
    settingsView.classList.remove('active');
  });

  // Glyph-rendering constants — keys match glyphSetConst inside the Glyph
  // module, and the same keying the sequence-tester's SLIDER_DEFS uses, for
  // consistency between the two tools' settings.
  const GLYPH_SLIDER_DEFS = [
    { key: 'canvasPadding', name: 'Padding', min: 10, max: 80, def: 36 },
    { key: 'labelFontSize', name: 'Label size', min: 12, max: 28, def: 18 },
    { key: 'labelPaddingExtra', name: 'Frame padding', min: 0, max: 12, def: 2 },
    { key: 'labelCornerRadius', name: 'Corner radius', min: 0, max: 16, def: 2 },
    { key: 'frameBorderWidth', name: 'Frame border', min: 1, max: 5, def: 3 },
    { key: 'circleLineWidth', name: 'Circle line', min: 1, max: 6, def: 3 },
    { key: 'connectorLineWidth', name: 'Connector', min: 1, max: 15, def: 5 },
    { key: 'dotRadius', name: 'Guide dot', min: 2, max: 10, def: 6 },
  ];
  // Mirrors whatever Glyph.setConst was last called with, per key — needed
  // so the sequence PNG's oversampling (below) can temporarily bump these
  // and restore the exact current values afterward, same reasoning as the
  // tester's currentConstValues.
  const currentGlyphConstValues = {};
  GLYPH_SLIDER_DEFS.forEach(def => { currentGlyphConstValues[def.key] = def.def; });
  currentGlyphConstValues.glyphRadius = 68; // hidden, no slider — matches GLYPH_RADIUS's own default inside the Glyph module (that variable is private to its closure, not accessible by name from here — this must scale with the rest during oversampling, Reply 195's bug)

  GLYPH_SLIDER_DEFS.forEach(def => {
    const row = document.createElement('div');
    row.className = 'glyphSliderRow';
    row.innerHTML = `<span class="name">${def.name}</span>
      <input type="range" min="${def.min}" max="${def.max}" value="${def.def}">
      <span class="val">${def.def}</span>`;
    const range = row.querySelector('input');
    const val = row.querySelector('.val');
    range.addEventListener('input', () => {
      const v = parseInt(range.value, 10);
      Glyph.setConst(def.key, v);
      currentGlyphConstValues[def.key] = v;
      val.textContent = range.value;
      // Live preview: re-render any already-locked photo's glyph, and the
      // glyph bar, so the effect is visible immediately against real
      // marked points — same reasoning as the sequence-tester's live update.
      images.forEach(rec => {
        if (rec.locked && rec.notation) rec.glyphSrc = Glyph.renderDataUrl(rec.notation);
      });
      renderGlyphBar();
    });
    glyphSlidersEl.appendChild(row);
  });

  // ==================== Modal orchestration ====================
  // No manager grid — the camera button always just opens the file picker.
  // The modal itself only opens once files are actually chosen (in the
  // fileInput 'change' handler below). This is also the fix for the
  // black-screen-on-cancel bug: previously the modal opened up front, so
  // cancelling the OS picker left an empty overlay with nothing rendered
  // in it. Now there's nothing to show until there's something to show.
  function closeModal() {
    modalOverlay.classList.remove('open');
  }
  cameraBtn.addEventListener('click', openFilePicker);

  function openFilePicker() {
    fileInput.value = '';
    fileInput.click();
  }

  // ==================== File picking → crop carousel ====================
  let pendingImages = [];  // Image objects for the current crop batch
  let pendingStates = [];  // { scale, offsetX, offsetY }
  let cropIndex = 0;

  fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;
    if (images.length + files.length > SOFT_CAP + 10) {
      alert('That is a lot of photos — consider adding them in smaller batches.');
    }

    pendingImages = [];
    pendingStates = [];
    let loaded = 0;
    files.forEach((file, i) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          pendingImages[i] = img;
          pendingStates[i] = { scale: 1, offsetX: 0, offsetY: 0 };
          loaded++;
          if (loaded === files.length) {
            cropIndex = 0;
            showCropView();
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  });

  function showCropView() {
    modalOverlay.classList.add('open');
    cropView.classList.add('active');
    updateCropChrome();
    drawCrop();
  }

  function currentCropState() { return pendingStates[cropIndex]; }

  function cropTransform() {
    const img = pendingImages[cropIndex];
    const st = currentCropState();
    const base = Math.max(CROP_SIZE / img.width, CROP_SIZE / img.height) * st.scale;
    const dw = img.width * base, dh = img.height * base;
    const dx = CROP_SIZE / 2 - dw / 2 + st.offsetX;
    const dy = CROP_SIZE / 2 - dh / 2 + st.offsetY;
    return { dw, dh, dx, dy };
  }

  // Reply 210-213: "Apply to all" — copies the active photo's crop
  // framing to every other pending photo. offsetX/offsetY are pixel
  // amounts in the fixed 280px output space, not comparable across photos
  // of different native dimensions on their own — so they're first
  // normalized into a *fraction* of the active photo's own scaled content
  // size (dw/dh), then that fraction gets converted back into the right
  // pixel amount for each target photo's own dw/dh. scale itself is
  // already relative (a multiplier against each photo's own dimensions),
  // so it copies over unchanged.
  function applyCropStateToAll() {
    const srcImg = pendingImages[cropIndex];
    const srcState = currentCropState();
    const srcBase = Math.max(CROP_SIZE / srcImg.width, CROP_SIZE / srcImg.height) * srcState.scale;
    const srcDw = srcImg.width * srcBase, srcDh = srcImg.height * srcBase;
    const fracX = srcState.offsetX / srcDw, fracY = srcState.offsetY / srcDh;

    pendingImages.forEach((img, i) => {
      if (i === cropIndex) return;
      const base = Math.max(CROP_SIZE / img.width, CROP_SIZE / img.height) * srcState.scale;
      const dw = img.width * base, dh = img.height * base;
      pendingStates[i] = { scale: srcState.scale, offsetX: fracX * dw, offsetY: fracY * dh };
    });
    showToast(`Applied this crop to ${pendingImages.length - 1} other photo(s)`);
  }

  function updateCropChrome() {
    cropIndicator.textContent = (cropIndex + 1) + ' / ' + pendingImages.length;
    cropPrev.disabled = cropIndex === 0;
    cropNext.disabled = cropIndex === pendingImages.length - 1;
    cropApplyAll.disabled = pendingImages.length < 2;
  }

  function drawCrop() {
    cctx.clearRect(0, 0, CROP_SIZE, CROP_SIZE);
    const img = pendingImages[cropIndex];
    const { dw, dh, dx, dy } = cropTransform();
    cctx.drawImage(img, dx, dy, dw, dh);
    // square frame outline
    cctx.strokeStyle = '#eee';
    cctx.lineWidth = 2;
    cctx.strokeRect(4, 4, CROP_SIZE - 8, CROP_SIZE - 8);
    drawCropGrid();
  }

  // Alignment aid only (Reply 42/43) — fixed lines at 1/3, 1/2, 2/3 on both
  // axes, same position on every photo. Purely a manual consistency guide
  // for framing the person the same size/position shot to shot; drawn only
  // in this live preview, never baked — cropConfirmAll below draws only
  // `img` into the output canvas, this function is never called there.
  function drawCropGrid() {
    const thirds = [CROP_SIZE / 3, CROP_SIZE / 2, (CROP_SIZE * 2) / 3];
    cctx.save();
    thirds.forEach(pos => {
      const isMid = pos === CROP_SIZE / 2;
      cctx.strokeStyle = isMid ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.5)';
      cctx.lineWidth = isMid ? 1.5 : 1;
      cctx.beginPath();
      cctx.moveTo(pos, 0);
      cctx.lineTo(pos, CROP_SIZE);
      cctx.moveTo(0, pos);
      cctx.lineTo(CROP_SIZE, pos);
      cctx.stroke();
    });
    cctx.restore();
  }

  function goToCrop(i) {
    cropIndex = Math.max(0, Math.min(pendingImages.length - 1, i));
    updateCropChrome();
    drawCrop();
  }
  cropPrev.addEventListener('click', () => goToCrop(cropIndex - 1));
  cropNext.addEventListener('click', () => goToCrop(cropIndex + 1));
  cropApplyAll.addEventListener('click', applyCropStateToAll);

  // pointer interaction: 1-finger swipe between images, 2-finger pinch/pan, mouse drag/wheel
  const pointers = new Map();
  let pinchStartDist = 0, pinchStartScale = 1, pinchStartMid = null;
  let singleStartX = null, becameMultiTouch = false, mouseDragging = false;
  const dist = pts => Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  const mid = pts => ({ x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 });

  cropCanvas.addEventListener('pointerdown', e => {
    cropCanvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (e.pointerType === 'mouse') { mouseDragging = true; singleStartX = e.clientX; return; }
    if (pointers.size === 1) { singleStartX = e.clientX; becameMultiTouch = false; }
    else if (pointers.size === 2) {
      becameMultiTouch = true;
      const pts = Array.from(pointers.values());
      pinchStartDist = dist(pts);
      pinchStartScale = currentCropState().scale;
      pinchStartMid = mid(pts);
    }
  });
  cropCanvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (e.pointerType === 'mouse' && mouseDragging) {
      const st = currentCropState();
      st.offsetX += e.movementX; st.offsetY += e.movementY;
      drawCrop();
      return;
    }
    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const d = dist(pts), m = mid(pts);
      const st = currentCropState();
      st.scale = Math.max(1, Math.min(3, pinchStartScale * (d / pinchStartDist)));
      st.offsetX += m.x - pinchStartMid.x;
      st.offsetY += m.y - pinchStartMid.y;
      pinchStartMid = m;
      drawCrop();
    }
  });
  function endCropPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (e.pointerType === 'mouse') { mouseDragging = false; singleStartX = null; return; }
    if (pointers.size === 0 && !becameMultiTouch && singleStartX !== null) {
      const dx = e.clientX - singleStartX;
      if (dx < -40 && cropIndex < pendingImages.length - 1) goToCrop(cropIndex + 1);
      else if (dx > 40 && cropIndex > 0) goToCrop(cropIndex - 1);
    }
    if (pointers.size === 0) { singleStartX = null; becameMultiTouch = false; }
  }
  cropCanvas.addEventListener('pointerup', endCropPointer);
  cropCanvas.addEventListener('pointercancel', endCropPointer);
  cropCanvas.addEventListener('wheel', e => {
    e.preventDefault();
    const st = currentCropState();
    st.scale = Math.max(1, Math.min(3, st.scale * (e.deltaY < 0 ? 1.08 : 0.92)));
    drawCrop();
  }, { passive: false });

  cropCancelAll.addEventListener('click', () => {
    pendingImages = []; pendingStates = [];
    cropView.classList.remove('active');
    closeModal();
  });

  cropConfirmAll.addEventListener('click', () => {
    const bakedRecs = pendingImages.map((img, i) => {
      const prevIndex = cropIndex;
      cropIndex = i;
      const { dw, dh, dx, dy } = cropTransform();
      cropIndex = prevIndex;

      const out = document.createElement('canvas');
      out.width = CROP_SIZE; out.height = CROP_SIZE;
      const octx = out.getContext('2d');
      octx.drawImage(img, dx, dy, dw, dh);
      return { id: newId(), src: out.toDataURL('image/jpeg', 0.92), locked: false, notation: null, glyphSrc: null };
    });
    activeIndex = images.length; // sync point: land on first newly added photo
    images = images.concat(bakedRecs);
    pendingImages = []; pendingStates = [];
    cropView.classList.remove('active');
    closeModal();
    setActiveSlot('A');
  });

  // ---- warn before an accidental reload/close if there's anything to lose ----
  window.addEventListener('beforeunload', (e) => {
    if (images.length === 0) return;
    e.preventDefault();
    e.returnValue = '';
  });

  // init
  renderMainCanvas();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
